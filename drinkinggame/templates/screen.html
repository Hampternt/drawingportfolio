<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room {{ code }} — Big Screen</title>
  <link rel="stylesheet" href="{{ base_path }}/assets/game.css">
</head>
<body class="screen">
  <div class="screen-grid">
    <div id="screen-panel" class="screen-left">{{ game_panel|safe }}</div>
    <div class="screen-right">
      <div id="emote-layer-big" class="screen-emote-layer" aria-hidden="true"></div>
      <div class="join-header">
        <div class="join-info">
          <span class="join-kicker">JOIN THE ROOM</span>
          <span class="join-code">{{ code }}</span>
        </div>
        <div class="qr-box">{{ qr_svg|safe }}</div>
      </div>
      <div class="standings-header">
        <span class="standings-kicker">STANDINGS</span>
        <div class="standings-rule"></div>
      </div>
      <ol id="standings-list" class="standings-list">{{ leaderboard_items|safe }}</ol>
    </div>
  </div>
  <script>
const BP = "{{ base_path }}", CODE = "{{ code }}";
const lastKeys = {}; let animFlip = false;
// Same anim-key strategy as room.html's swapPanel, trimmed: no htmx.process
// (this page never posts anything) and no personalize (a spectator has no
// player id to key off of).
function swapPanel(id, evName, html) {
  const el = document.getElementById(id);
  el.innerHTML = html;
  const keyed = el.querySelector("[data-anim-key]");
  if (keyed) {
    const key = keyed.dataset.animKey;
    if (evName in lastKeys && lastKeys[evName] !== key) {
      animFlip = !animFlip;
      el.querySelectorAll("[data-anim]").forEach(a => a.classList.add(animFlip ? "anim-a" : "anim-b"));
    }
    lastKeys[evName] = key;
  }
}
const es = new EventSource(BP + "/room/" + CODE + "/sse");
es.addEventListener("screen", e => swapPanel("screen-panel", "screen", e.data));
es.addEventListener("leaderboard", e => { document.getElementById("standings-list").innerHTML = e.data; });
es.addEventListener("emote", e => {
  const s = document.createElement("span");
  s.className = "emote-float emote-float-big";
  s.textContent = e.data;
  s.style.left = (12 + Math.random() * 70) + "%";
  document.getElementById("emote-layer-big").appendChild(s);
  setTimeout(() => s.remove(), 1200);
});
es.addEventListener("ended", () => { es.close(); window.location = BP + "/"; });
  </script>
</body>
</html>
