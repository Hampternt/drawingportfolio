<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorting · live board demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; }
    a { color: #CBB0FF; } a:hover { color: #DED0FF; }
    * { box-sizing: border-box; }
    /* A stack arriving in the van slides from the spot it was built on.
       `translate` is an independent transform property, so it composes OUTSIDE
       the sheared `transform` the stack already carries and leaves the matrix
       alone. The runtime rebuilds the tree on every paint, and a freshly created
       element always starts its animation — so the full re-render is what drives
       this rather than what breaks it. */
    @keyframes sc-push { from { translate: var(--dx) var(--dy); } to { translate: 0 0; } }
  </style>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #07060B; color: #CDC6DD;
               font-family: "Space Grotesk", system-ui, sans-serif; }
  #chrome { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap;
            padding: 12px 16px; border-bottom: 1px solid #1A1723; background: #0B0910; }
  #chrome h1 { font-family: Archivo, system-ui, sans-serif; font-size: 15px; font-weight: 800;
               letter-spacing: -0.02em; color: #F2EEF8; margin: 0; align-self: center;
               padding-right: 8px; white-space: nowrap; }
  .tier { flex: 1 1 240px; min-width: 0; text-align: left; cursor: pointer;
          background: #0E0C14; border: 1px solid #262232; border-radius: 11px;
          padding: 9px 12px; color: #8D87A0; font: inherit; display: flex;
          flex-direction: column; gap: 2px; }
  .tier b { font-family: Archivo, system-ui, sans-serif; font-size: 14px; color: #CDC6DD; }
  .tier span { font-size: 11.5px; line-height: 1.35; color: #5F5876; }
  .tier.on { background: #17141F; border-color: #B48EF7; }
  .tier.on b { color: #F2EEF8; }
  .tier.on span { color: #8D87A0; }
  #reset { align-self: center; cursor: pointer; background: rgba(242,238,248,.05);
           border: 1px solid #262232; border-radius: 10px; color: #CDC6DD;
           font: inherit; font-size: 13px; padding: 10px 16px; white-space: nowrap; }
  /* Authored at exactly 1440x840 CSS — the Movink Pad Pro in landscape after
     the URL bar. Anything narrower is scaled, never reflowed, so what you tap
     here is what you tap there. */
  #stage { display: flex; justify-content: center; overflow: hidden; }
  #scaler { transform-origin: top center; }
  #board { width: 1440px; height: 840px; }
</style>
</head>
<body>

<div id="chrome">
  <h1>Live board</h1>
      <button class="tier" data-tier="1"><b>Customer order only</b><span>The route list and nothing else. Every count, every position and every stack height gets decided at the pallet.</span></button>
      <button class="tier" data-tier="2"><b>Order + crate counts</b><span>Weighed or scanned totals per customer. The board plans the whole van up front and shows what belongs where before anything is lifted.</span></button>
      <button class="tier" data-tier="3"><b>Everything scanned</b><span>Counts plus which pallet each order is buried in, so the board can also say what to pull next and from where.</span></button>
  <button id="reset">Start over</button>
</div>

<div id="stage"><div id="scaler"><div id="board"></div></div></div>

<template id="board-template">
<div style="width: 1440px; height: 840px; background: #0B0910; color: #CDC6DD; position: relative; overflow: hidden; font-size: 16px;">

  <!-- ── the van, drawn from its rear right corner ───────────────────────────
       Every piece of the picture is one absolutely positioned div carrying its
       own transform, emitted back to front, so paint order is depth order and
       no z-index is needed. Floor tiles and stack faces are sheared; anything
       with words in it is a separate upright chip, because sheared text is
       unreadable and this is read at arm's length in the rain. -->
  <div style="{{scene.box}}">
    <sc-for list="{{scene.parts}}" as="p" hint-placeholder-count="40">
      <div onClick="{{p.tap}}" style="{{p.style}}"><sc-for list="{{p.kids}}" as="k" hint-placeholder-count="4"><div style="{{k.style}}"></div></sc-for>{{p.text}}</div>
    </sc-for>
  </div>

  <!-- ── header ─────────────────────────────────────────────────────────────
       Over the empty corner the diagonal leaves at the top left. -->
  <div style="position: absolute; left: 24px; top: 14px; display: flex; align-items: center; gap: 14px;">
    <div style="width: 42px; height: 42px; border: 1px solid #262232; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8D87A0; font-size: 19px; flex: none;">&#8592;</div>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="font: 800 19px/1.2 Archivo, system-ui, sans-serif; letter-spacing: -0.025em; color: #F2EEF8;">{{head.title}}</div>
      <div style="font: 500 11px/1.4 'IBM Plex Mono', monospace; letter-spacing: 0.09em; color: #8D87A0;">{{head.sub}}</div>
    </div>
    <div style="display: flex; gap: 22px; margin-left: 24px;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: 0.09em; color: #5F5876; white-space: nowrap;">{{s.label}}</span>
          <span style="{{s.style}}">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- ── the dock ───────────────────────────────────────────────────────────
       Standing on the pavement wedge between the two clusters of packing spots,
       tethered by a line to whichever one it is driving. The top row is the loop
       the driver runs a hundred times a load and its buttons never move; the
       bottom row is everything that ends something. -->
  <div style="{{con.box}}">
    <div style="display: flex; align-items: baseline; gap: 9px; min-width: 0; flex: none;">
      <span style="{{con.eyebrowStyle}}">{{con.eyebrow}}</span>
      <span style="{{con.noteStyle}}">{{con.note}}</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: stretch; flex: none;">
      <div onClick="{{con.minus}}" style="{{con.minusStyle}}">&#8722;</div>
      <div onClick="{{con.plus}}" style="{{con.plusStyle}}">
        <span style="{{con.plusBig}}">{{con.plusLabel}}</span>
        <span style="{{con.plusSub}}">{{con.plusNote}}</span>
      </div>
      <div onClick="{{con.push}}" style="{{con.pushStyle}}">
        <span style="{{con.pushBig}}">{{con.pushLabel}}</span>
        <span style="{{con.pushSub}}">{{con.pushNote}}</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; align-items: stretch; flex: none;">
      <div onClick="{{con.top}}" style="{{con.topStyle}}">
        <span style="{{con.topBig}}">{{con.topLabel}}</span>
        <span style="{{con.topSub}}">{{con.topNote}}</span>
      </div>
      <div onClick="{{con.done}}" style="{{con.doneStyle}}"><span style="{{con.doneBig}}">{{con.doneLabel}}</span></div>
      <div onClick="{{con.undo}}" style="{{con.undoStyle}}"><span style="{{con.undoBig}}">{{con.undoLabel}}</span></div>
    </div>
    <sc-if value="{{con.showWhy}}" hint-placeholder-val="{{true}}">
      <div style="{{con.whyStyle}}">{{con.why}}</div>
    </sc-if>
  </div>

  <!-- ── the route, in loading order ────────────────────────────────────────
       Reverse of delivery: the last drop goes in first and ends up deepest.
       Each stop says which door to pack it at, because that is the only choice
       the board cannot make for you. -->
  <div style="position: absolute; right: 16px; top: 14px; width: 376px; height: 812px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 3px 2px; flex: none;">
      <span style="font: 600 11px/1 'IBM Plex Mono', monospace; letter-spacing: 0.10em; color: #8D87A0;">LOADING ORDER</span>
      <span style="font: 400 11px/1 'Space Grotesk', sans-serif; color: #5F5876;">last delivery in first</span>
    </div>

    <sc-for list="{{queue}}" as="q" hint-placeholder-count="6">
      <div onClick="{{q.tap}}" style="{{q.tile}}">
        <div style="{{q.barStyle}}"></div>
        <div style="display: flex; flex-direction: column; gap: 1px; flex: 1 1 0; min-width: 0;">
          <span style="{{q.nameStyle}}">{{q.name}}</span>
          <span style="{{q.stateStyle}}">{{q.state}}</span>
        </div>
        <sc-if value="{{q.hasDoors}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; gap: 5px; flex: none;">
            <div onClick="{{q.side}}" style="{{q.sideStyle}}">{{q.sideLabel}}</div>
            <div onClick="{{q.rear}}" style="{{q.rearStyle}}">{{q.rearLabel}}</div>
          </div>
        </sc-if>
        <sc-if value="{{q.hasReopen}}" hint-placeholder-val="{{false}}">
          <div onClick="{{q.reopen}}" style="{{q.reopenStyle}}">reopen</div>
        </sc-if>
      </div>
    </sc-for>

    <div style="flex: 1 1 0; min-height: 0;"></div>

    <sc-if value="{{warn.show}}" hint-placeholder-val="{{false}}">
      <div style="{{warn.style}}">{{warn.text}}</div>
    </sc-if>

    <div style="display: flex; gap: 6px; flex: none;">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
        <div onClick="{{t.tap}}" style="{{t.style}}">
          <span style="{{t.bigStyle}}">{{t.label}}</span>
          <span style="{{t.subStyle}}">{{t.sub}}</span>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</template>

<script>
// ── a very small template runtime ────────────────────────────────────────────
// Renders the same markup the artboards use — {{dotted.path}} holes, <sc-for>,
// <sc-if>, onClick handlers — so the demo and the design cannot drift. The
// markup lives in an inert <template>, which is what stops the browser trying
// to compile onClick as script.
function resolve(scope, path) {
  return String(path).split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
}
function interp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, function (_, p) {
    var v = resolve(scope, p.trim());
    return v == null ? '' : String(v);
  });
}
function hole(attr) { return String(attr).replace(/\{\{|\}\}/g, '').trim(); }

function build(node, scope) {
  if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, scope))];
  if (node.nodeType !== 1) return [];
  var tag = node.tagName.toLowerCase(), out = [];

  if (tag === 'sc-for') {
    var list = resolve(scope, hole(node.getAttribute('list'))) || [];
    var as = node.getAttribute('as');
    list.forEach(function (item) {
      var inner = Object.create(scope);
      inner[as] = item;
      Array.prototype.forEach.call(node.childNodes, function (c) { out = out.concat(build(c, inner)); });
    });
    return out;
  }
  if (tag === 'sc-if') {
    if (!resolve(scope, hole(node.getAttribute('value')))) return [];
    Array.prototype.forEach.call(node.childNodes, function (c) { out = out.concat(build(c, scope)); });
    return out;
  }

  var el = document.createElement(tag);
  Array.prototype.forEach.call(node.attributes, function (a) {
    if (a.name.toLowerCase() === 'onclick') {
      var fn = resolve(scope, hole(a.value));
      if (typeof fn === 'function') {
        el.style.cursor = 'pointer';
        el.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); fn(); });
      }
      return;
    }
    el.setAttribute(a.name, interp(a.value, scope));
  });
  Array.prototype.forEach.call(node.childNodes, function (c) {
    build(c, scope).forEach(function (n) { el.appendChild(n); });
  });
  return [el];
}

// ── the shim the board's logic is written against ────────────────────────────
var COMPONENT = null, PENDING = false;
class DCLogic {
  constructor(props) { this.props = props || {}; }
  setState(o) { Object.assign(this.state, o); schedule(); }
}
function schedule() {
  if (PENDING) return;
  PENDING = true;
  requestAnimationFrame(function () { PENDING = false; paint(); });
}
function paint() {
  var tpl = document.getElementById('board-template');
  var host = document.getElementById('board');
  var vals = COMPONENT.renderVals();
  host.textContent = '';
  Array.prototype.forEach.call(tpl.content.childNodes, function (c) {
    build(c, vals).forEach(function (n) { host.appendChild(n); });
  });
  document.querySelectorAll('[data-tier]').forEach(function (b) {
    b.classList.toggle('on', Number(b.dataset.tier) === (COMPONENT.props.tier || 1));
  });
}

// ── Live mode ────────────────────────────────────────────────────────────────
// No manifest, no generated plan, no crate counts. The only input is the stop
// list. Every rule the generator used to settle up front has to be enforced
// live instead, at the moment of the tap.
// A third length, for cells too narrow to hold a name — nine positions across
// 1440px leaves about seventy pixels for text.
//
// It has to be derived from the actual stop list, never hashed per name: three
// letters of the first word renders "Rema 1000 Hillevåg" and "Rema 1000 Madla"
// identically, and on this board a code is what you read before you carry crates
// into a building. Collisions lengthen until they separate.
function makeCodes(names) {
  var keys = Object.keys(names), out = {}, used = {}, W = {};
  function words(x) {
    return String(x).toUpperCase().replace(/[^A-ZÆØÅ0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);
  }
  keys.forEach(function (k) { W[k] = words(names[k]); });

  // Group by the first word, because that is what collides — a street of Rema
  // 1000s, three Coops, two Jåtten somethings.
  var groups = {};
  keys.forEach(function (k) {
    var g = (W[k][0] || '').slice(0, 3);
    (groups[g] = groups[g] || []).push(k);
  });

  keys.forEach(function (k) {
    var w = W[k], first = w[0] || String(k), head = first.slice(0, 3), c = [];
    if ((groups[head] || []).length > 1) {
      // The shared word carries no information, so build the code out of the
      // word that does — skipping bare numbers, which "Rema 1000" is full of.
      var tail = w.slice(1).filter(function (t) { return !/^[0-9]+$/.test(t); });
      var d = tail[0] || w[1] || '';
      c.push(first.slice(0, 1) + d.slice(0, 2));
      c.push(first.slice(0, 1) + d.slice(0, 3));
      c.push(first.slice(0, 2) + d.slice(0, 2));
      c.push(head + d.slice(0, 1));
      if (tail[1]) c.push(first.slice(0, 1) + tail[1].slice(0, 2));
    }
    c.push(head, first.slice(0, 4), head + (w[1] || '').slice(0, 1));

    var pick = null;
    for (var i = 0; i < c.length && !pick; i++) if (c[i] && c[i].length >= 2 && !used[c[i]]) pick = c[i];
    if (!pick) {                       // never collide: number them rather than repeat
      var base = head || 'X', n = 2;
      while (used[base + n]) n++;
      pick = base + n;
    }
    used[pick] = true;
    out[k] = pick;
  });
  return out;
}

var CUST = {
  OLA: { name: 'Olavstoppen',    short: 'Olavstoppen', color: '#6FBF97' },
  JAT: { name: 'Jåtten Skole',   short: 'Jåtten', color: '#FFB570' },
  HIN: { name: 'Hinna',          short: 'Hinna', color: '#F7768E' },
  SVE: { name: 'Sverdrup Steel', short: 'Sverdrup', color: '#7AA2F7' },
  FRO: { name: 'Frøystad',       short: 'Frøystad', color: '#B48EF7' },
  MAR: { name: 'Marlink',        short: 'Marlink', color: '#4FD6A8' }
};

// Delivery order, exactly as the route app lists it. Stop 1 is delivered first.
var STOPS = [
  { i: 1, key: 'MAR' }, { i: 2, key: 'FRO' }, { i: 3, key: 'SVE' },
  { i: 4, key: 'HIN' }, { i: 5, key: 'JAT' }, { i: 6, key: 'OLA' }
];
// Loading runs the other way: the last delivery goes in first and ends up
// deepest, against the cab.
var QUEUE = STOPS.slice().reverse().map(function (s) { return s.key; });
function stopOf(k) { return STOPS.filter(function (s) { return s.key === k; })[0]; }

// ── the van ──────────────────────────────────────────────────────────────────
// None of these are the app's to decide, and there is more than one van in the
// fleet, so they are settings rather than constants.
//
// Nine rows, not the seven the methodology doc assumed — the floor turned out
// longer than it was first paced out. The side door's reach is still the doc's
// four, but that number was written against a seven-row picture, so it is worth
// re-checking against a van that is two positions longer.
//
// Two columns is the one number that is not a setting: the ±3 stability rule is
// defined per column, front to back, and left is never compared to right. That
// shape is the rule, not a measurement.
// Demo fixtures for the three levels of foresight. COUNTS is what a weighed or
// scanned order sheet gives you; PALLETS is what reading the pallet photos adds
// on top of it. Neither exists in a route-only session.
var COUNTS = { OLA: 10, JAT: 5, HIN: 2, SVE: 7, FRO: 4, MAR: 3 };
var PALLETS = { OLA: 'B', JAT: 'C', HIN: 'C', SVE: 'A', FRO: 'A', MAR: 'B' };

var ROWS, CAP, SIDE_DOOR_ROWS, STAB = 3, ORDER = [], SPOTS = [], DOORS = [], ALL_POS = [];

function configure(cfg) {
  cfg = cfg || {};
  ROWS = cfg.rows == null ? 9 : cfg.rows;
  CAP = cfg.capacity == null ? 8 : cfg.capacity;
  SIDE_DOOR_ROWS = cfg.sideDoorRows == null ? 4 : Math.min(cfg.sideDoorRows, ROWS);
  var nSide = cfg.sideSpots == null ? 3 : cfg.sideSpots;
  var nBack = cfg.backSpots == null ? 2 : cfg.backSpots;

  // Rows run 1→N because nothing can be put in front of what is already
  // aboard. Within a row LEFT goes before RIGHT because the door is on the
  // van's right: the far column has to be crossed to, and a filled near column
  // blocks that path.
  ORDER = [];
  for (var r = 1; r <= ROWS; r++) { ORDER.push('r' + r + '-left'); ORDER.push('r' + r + '-right'); }

  SPOTS = [];
  for (var i = 1; i <= nSide; i++) SPOTS.push({ id: 'side-' + i, door: 'side', name: 'SIDE ' + i });
  for (var j = 1; j <= nBack; j++) SPOTS.push({ id: 'back-' + j, door: 'back', name: 'BACK ' + j });

  // The doorways themselves. Off the grid — nothing routine goes here and
  // nextPosition() cannot reach them — but they are floor, and when the van
  // runs short they are floor you can stand a stack on.
  DOORS = [];
  if (SIDE_DOOR_ROWS > 0) DOORS.push('door-side');
  DOORS.push('door-back');
  ALL_POS = ORDER.concat(DOORS);
}
function isDoor(id) { return String(id).indexOf('door-') === 0; }
function doorwayOf(door) { return 'door-' + door; }

function rowOf(id) { return isDoor(id) ? ROWS + 1 : parseInt(String(id).slice(1), 10); }
function colOf(id) { return id.indexOf('left') > -1 ? 'left' : 'right'; }
function doorOf(id) { return isDoor(id) ? String(id).slice(5) : (rowOf(id) <= SIDE_DOOR_ROWS ? 'side' : 'back'); }
function zone(door) { return ORDER.filter(function (id) { return doorOf(id) === door; }); }
function posLabel(id) {
  if (id === 'door-side') return 'SIDE DOORWAY';
  if (id === 'door-back') return 'BACK DOORWAY';
  return 'R' + rowOf(id) + ' · ' + (colOf(id) === 'left' ? 'L' : 'R');
}

configure({});
(function () {
  var names = {};
  Object.keys(CUST).forEach(function (k) { names[k] = CUST[k].name; });
  var codes = makeCodes(names);
  Object.keys(CUST).forEach(function (k) { CUST[k].code = codes[k]; });
}());
function spotById(id) { return SPOTS.filter(function (s) { return s.id === id; })[0]; }

var MONO = "'IBM Plex Mono', monospace";

// ── reading the state ────────────────────────────────────────────────────────
// van[id] is a stack, bottom first. n === null means it went in uncounted.
function heightOf(st, id) {
  var n = 0, unknown = false;
  st.van[id].forEach(function (l) { if (l.n == null) unknown = true; else n += l.n; });
  return unknown ? null : n;
}
function isEmpty(st, id) { return st.van[id].length === 0; }

// The innermost position this door can still reach — what the push-in button
// works out so the user never has to.
// A split reserves the next position in the same column for the rest of that
// order. Held is not free — but it is only ever held for the customer whose
// stack it continues, and only while that stack is still open.
function heldFor(st, cust) {
  var keys = Object.keys(st.held || {});
  for (var i = 0; i < keys.length; i++) if (st.held[keys[i]] === cust) return keys[i];
  return null;
}
function isHeldAgainst(st, id, cust) {
  return !!(st.held && st.held[id] && st.held[id] !== cust);
}
function nextPosition(st, door, cust) {
  var z = zone(door);
  for (var i = 0; i < z.length; i++) {
    if (!isEmpty(st, z[i])) continue;
    if (cust !== undefined && isHeldAgainst(st, z[i], cust)) continue;
    return z[i];
  }
  return null;
}
function sideDoorOpen(st) { return nextPosition(st, 'side') !== null; }

// Everything outward of the innermost free position is free too — we fill in
// order — so any empty position in this door's zone is physically reachable.
// The board defaults to the innermost because that is what the loading order
// wants, but the driver can name a different one, and sometimes should: keeping
// the deep positions clear for a big order still on the pallet is a real call.
function resolveTarget(st, door, chosen, cust) {
  if (chosen && doorOf(chosen) === door && isEmpty(st, chosen)) return chosen;
  // The rest of a split order goes where the split said it would.
  var hold = cust ? heldFor(st, cust) : null;
  if (hold && doorOf(hold) === door && isEmpty(st, hold)) return hold;
  return nextPosition(st, door, cust);
}
function targetIsChosen(st, door, chosen, cust) {
  var auto = nextPosition(st, door, cust);
  return !!(chosen && resolveTarget(st, door, chosen, cust) === chosen && chosen !== auto);
}
function positionsLeft(st, door) {
  return zone(door).filter(function (id) { return isEmpty(st, id); }).length;
}
function stagedAtDoor(st, door) {
  return SPOTS.filter(function (s) { return s.door === door && st.staged[s.id]; }).length;
}
function cratesIn(st) {
  var n = 0;
  ALL_POS.forEach(function (id) { (st.van[id] || []).forEach(function (l) { n += (l.n || 0); }); });
  return n;
}
// Positions is the number that is always exact. Crates is not: under a gesture
// where pushing blind is normal, cratesIn read 0 with five stacks aboard.
function positionsIn(st) {
  return ALL_POS.filter(function (id) { return (st.van[id] || []).length; }).length;
}
function uncountedIn(st) {
  return ALL_POS.filter(function (id) {
    return (st.van[id] || []).some(function (l) { return l.n == null; });
  }).length;
}
// Space is limited before it is gone. The doorway gets offered while there is
// still a choice about what goes in it, not once there is none.
function stopsNotAboard(st) {
  return QUEUE.filter(function (k) { return !st.closed[k] && !isAboard(st, k); }).length;
}
function spaceIsTight(st) {
  var free = positionsLeft(st, 'side') + positionsLeft(st, 'back');
  return free === 0 || free < stopsNotAboard(st);
}
// A doorway stack is the most reachable thing in the van and the first thing in

// Splitting a big order, solved rather than guessed.

// Run the live rules forward over counts that are already known. Same window,

// ── the push-in guard ────────────────────────────────────────────────────────

// ── beginning a customer ─────────────────────────────────────────────────────

  }

    // which is a real thing the driver does the moment a door shuts on them.

    }

    for (var rr = 0; rr < ROWS; rr++) {
      chip(P(-V.gutter, rr + 0.5), 'R' + (rr + 1),
        mono + 'font-size:' + fx(11 * k + 1) + 'px;color:' + (rr < SIDE_DOOR_ROWS && !shut ? '#7A6E58' : '#57506E') + ';');
    }

    // ── the load, back to front ──────────────────────────────────────────────
    // Emission order is depth order: a nearer stack is drawn later and paints
    // over what it stands in front of, which is what it does in the van.
    function stripes(layers, f) {
      return layers.slice().reverse().map(function (l) {
        return { style: 'flex:' + (l.n || 1) + ' 0 0;min-height:0;background:' + shade(CUST[l.cust].color, f) + ';'
          + 'background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ' + fx(ch - 1)
          + 'px,rgba(0,0,0,.42) ' + fx(ch - 1) + 'px,rgba(0,0,0,.42) ' + fx(ch) + 'px);'
          + 'box-shadow:inset 0 -1px 0 rgba(0,0,0,.5);' };
      });
    }
    // Three faces per stack, not per crate: the one facing the back doors, the
    // one facing the right wall, and the top. The crate lines are a gradient
    // inside each customer's band, so an eight-high stack is still four divs.
    function drawStack(u, v, layers, n, tap, slide) {
      var h = n * ch;
      var o1 = P(u, v + 1, n);
      parts.push({ kids: stripes(layers, 0.70), text: '', tap: tap || noop,
        style: 'position:absolute;left:0;top:0;width:' + fx(cx) + 'px;height:' + fx(h) + 'px;transform-origin:0 0;'
          + 'transform:matrix(1,' + fx(cy / cx) + ',0,1,' + fx(o1[0]) + ',' + fx(o1[1]) + ');display:flex;flex-direction:column;'
          + (slide || '') });
      var o2 = P(u + 1, v, n);
      parts.push({ kids: stripes(layers, 0.46), text: '', tap: tap || noop,
        style: 'position:absolute;left:0;top:0;width:' + fx(rx) + 'px;height:' + fx(h) + 'px;transform-origin:0 0;'
          + 'transform:matrix(-1,' + fx(ry / rx) + ',0,1,' + fx(o2[0]) + ',' + fx(o2[1]) + ');display:flex;flex-direction:column;'
          + (slide || '') });
      quad(P(u, v, n), COL, ROW, 'background:' + shade(CUST[layers[layers.length - 1].cust].color, 1)
        + ';box-shadow:inset 0 0 0 1px rgba(0,0,0,.38);' + (slide || ''), tap);
    }

    for (var row = 0; row < ROWS; row++) {
      for (var col = 0; col < 2; col++) {
        (function (row, col) {
          var id = 'r' + (row + 1) + '-' + (col ? 'right' : 'left');
          var layers = st.van[id], n = heightOf(st, id), unknown = n == null && layers.length;
          var isNext = id === frontier, isHost = id === hostNow;
          var reach = doorOf(id) === 'side' && shut && !layers.length;
          var tap = function () { self.pickCell(self.state.st, id); };
          var ghost = (!layers.length && plan && plan.van[id] && plan.van[id].length) ? plan.van[id] : null;

          quad(P(col, row), COL, ROW,
            (isNext ? 'background:' + accent + '2E;box-shadow:inset 0 0 0 2px ' + (picked ? '#FFB570' : accent) + ';'
              : (layers.length ? 'background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(203,176,255,.10);'
                : (reach ? 'background:rgba(247,118,142,.05);box-shadow:inset 0 0 0 1px rgba(247,118,142,.16);'
                  : 'background:rgba(203,176,255,.022);box-shadow:inset 0 0 0 1px rgba(203,176,255,.13);')))
            + 'cursor:pointer;', tap);

          var gn = ghost ? ghost.reduce(function (a, l) { return a + l.n; }, 0) : 0;
          if (ghost) {
            // Drawn as a volume, not a floating rectangle: a face down to the
            // floor is what stops a planned stack reading as a lid hanging in
            // mid-air over the position two rows behind it.
            var oF = P(col, row + 1, gn);
            parts.push({ kids: [], text: '', tap: tap,
              style: 'position:absolute;left:0;top:0;width:' + fx(cx) + 'px;height:' + fx(gn * ch)
                + 'px;transform-origin:0 0;transform:matrix(1,' + fx(cy / cx) + ',0,1,' + fx(oF[0]) + ',' + fx(oF[1])
                + ');background:rgba(122,162,247,.07);border-left:1px dashed rgba(122,162,247,.4);'
                + 'border-right:1px dashed rgba(122,162,247,.4);' });
            quad(P(col, row, gn), COL, ROW,
              'background:rgba(122,162,247,.10);box-shadow:inset 0 0 0 1px rgba(122,162,247,.55);', tap);
          }
          if (layers.length) {
            var draw = unknown ? [{ cust: layers[0].cust, n: 1 }] : layers;
            var flash = self.state.flash, slide = '';
            if (flash && flash.id === id && spotById(flash.from)) {
              var from = padCentre(spotById(flash.from)), to = P(col + 0.5, row + 0.5);
              slide = '--dx:' + fx(from[0] - to[0]) + 'px;--dy:' + fx(from[1] - to[1]) + 'px;'
                + 'animation:sc-push 260ms cubic-bezier(.22,.61,.36,1);';
            }
            drawStack(col, row, draw, unknown ? 1 : n, tap, slide);
            var names = [];
            layers.forEach(function (l) { if (names.indexOf(l.cust) < 0) names.push(l.cust); });
            chip(P(col + 0.5, row + 0.26, unknown ? 1 : n),
              names.map(function (c) { return CUST[c].code; }).join('+') + ' ' + (unknown ? '?' : n),
              'font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:' + fx(12 * k + 1) + 'px;'
              + 'color:#0B0910;text-shadow:0 1px 0 rgba(255,255,255,.28);');
            if (isHost && hostTake) {
              // What the top-up would do, drawn where it would land: the crates
              // themselves, in the customer's colour, standing on the host.
              var base = unknown ? 1 : n, oG = P(col, row + 1, base + hostTake);
              parts.push({ kids: [], text: '', tap: tap,
                style: 'position:absolute;left:0;top:0;width:' + fx(cx) + 'px;height:' + fx(hostTake * ch)
                  + 'px;transform-origin:0 0;transform:matrix(1,' + fx(cy / cx) + ',0,1,' + fx(oG[0]) + ',' + fx(oG[1])
                  + ');background:' + shade(CUST[held.cust].color, 0.7, 0.5) + ';border:1px dashed #FFB570;' });
              quad(P(col, row, base + hostTake), COL, ROW,
                'background:' + shade(CUST[held.cust].color, 1, 0.55) + ';box-shadow:inset 0 0 0 2px #FFB570;', tap);
              chip(P(col + 0.5, row + 0.24, base + hostTake), '+' + hostTake,
                'font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:' + fx(12 * k + 1) + 'px;color:#FFF2E2;');
            }
          } else if (isNext || ghost) {
            // One chip per position. The next position with a plan on it has two
            // things to say and they are the same sentence, not two labels
            // stacked on top of each other.
            var planned = ghost ? ghost.map(function (l) { return CUST[l.cust].code; }).join('+') + ' ' + gn : '';
            chip(P(col + 0.5, row + (ghost ? 0.26 : 0.5), gn),
              isNext ? (picked ? 'PICKED' : 'NEXT') + (planned ? ' · ' + planned : ' IN') : planned,
              (ghost && !isNext ? "font-family:Archivo,system-ui,sans-serif;font-weight:700;" : mono + 'font-weight:600;letter-spacing:.09em;')
              + 'font-size:' + fx((ghost && !isNext ? 11 : 10) * k + 1) + 'px;'
              + 'color:' + (picked ? '#FFB570' : (isNext ? '#CBB0FF' : '#7AA2F7')) + ';');
          }
        }(row, col));
      }
    }

    // ── the ground outside ───────────────────────────────────────────────────
    // Pavement, not van floor — so the pads are drawn flat and unwalled, and the
    // pile you have built on one stands on it exactly the way it will stand in
    // the van a moment later.
    function drawPad(spot, u0, v0, w, d, outward) {
      var on = st.staged[spot.id], isFocus = spot.id === focus;
      var col = on ? CUST[on.cust].color : '#5F5876';
      quad(P(u0, v0), mul(COL, w), mul(ROW, d),
        'background:' + (on ? 'rgba(242,238,248,.05)' : 'rgba(242,238,248,.022)')
        + ';box-shadow:inset 0 0 0 ' + (isFocus ? '2px ' + accent : '1px ' + (on ? col + '66' : '#2A2438')) + ';cursor:pointer;',
        function () { self.setState({ focus: spot.id, target: null, host: null }); });
      if (on && on.n) {
        // Inset, so the pad stays readable as ground with a pile standing on it.
        var m = 0.1, iu = u0 + m, iv = v0 + m, iw = w - 2 * m, id = d - 2 * m;
        var n = Math.min(on.n, STAGE_CAP);
        var h = n * ch, oA = P(iu, iv + id, n), oB = P(iu + iw, iv, n);
        parts.push({ kids: stripes([{ cust: on.cust, n: n }], 0.70), text: '', tap: noop,
          style: 'position:absolute;left:0;top:0;width:' + fx(cx * iw) + 'px;height:' + fx(h) + 'px;transform-origin:0 0;'
            + 'transform:matrix(1,' + fx(cy / cx) + ',0,1,' + fx(oA[0]) + ',' + fx(oA[1]) + ');display:flex;flex-direction:column;' });
        parts.push({ kids: stripes([{ cust: on.cust, n: n }], 0.46), text: '', tap: noop,
          style: 'position:absolute;left:0;top:0;width:' + fx(rx * id) + 'px;height:' + fx(h) + 'px;transform-origin:0 0;'
            + 'transform:matrix(-1,' + fx(ry / rx) + ',0,1,' + fx(oB[0]) + ',' + fx(oB[1]) + ');display:flex;flex-direction:column;' });
        quad(P(iu, iv, n), mul(COL, iw), mul(ROW, id),
          'background:' + shade(col, 1) + ';box-shadow:inset 0 0 0 1px rgba(0,0,0,.38);');
        chip(P(u0 + w / 2, v0 + d / 2, n), CUST[on.cust].code + ' ' + on.n,
          'font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:' + fx(13 * k + 1) + 'px;'
          + 'letter-spacing:-.01em;color:#0B0910;text-shadow:0 1px 0 rgba(255,255,255,.26);');
      } else if (on) {
        chip(P(u0 + w / 2, v0 + d / 2), CUST[on.cust].code + ' ·',
          'font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:' + fx(13 * k + 1) + 'px;color:' + col + ';');
      } else {
        chip(P(u0 + w / 2, v0 + d / 2), 'free',
          "font-family:'Space Grotesk',sans-serif;font-size:" + fx(11 * k + 1) + 'px;color:#3F3A52;');
      }
      // The spot's own name always sits on the pavement in front of it, so a
      // pile standing on the pad never hides which pad it is.
      chip(outward ? P(u0 + w + 0.26, v0 + d / 2) : P(u0 + w / 2, v0 + d + 0.28), spot.name,
        mono + 'font-size:' + fx(10 * k + 1) + 'px;font-weight:600;letter-spacing:.09em;'
        + 'color:' + (isFocus ? '#CBB0FF' : (on ? '#8D87A0' : '#4A445C')) + ';');
    }
    // A line from the focused pad to the dock, so "the packing area this
    // customer is being packed in" and the controls that act on it are visibly
    // one thing even though the controls never move.
    if (focus) {
      var pc = padCentre(spotById(focus));
      var ax = pc[0] + ox, ay = pc[1] + oy;
      var bx = Math.max(DOCK.x, Math.min(DOCK.x + DOCK.w, ax));
      var by = Math.max(DOCK.y, Math.min(DOCK.y + DOCK.h, ay));
      var dx = bx - ax, dy = by - ay, len = Math.sqrt(dx * dx + dy * dy);
      if (len > 8) {
        var col = held ? CUST[held.cust].color : accent;
        parts.push({ kids: [], text: '', tap: noop,
          style: 'position:absolute;left:' + fx(pc[0]) + 'px;top:' + fx(pc[1]) + 'px;width:' + fx(len) + 'px;'
            + 'height:2px;transform-origin:0 50%;pointer-events:none;'
            + 'transform:rotate(' + fx(Math.atan2(dy, dx) * 180 / Math.PI) + 'deg);'
            + 'background:linear-gradient(to right,' + col + '00,' + col + 'AA);' });
      }
    }

    sideSpots.forEach(function (s, i) { drawPad(s, V.padU, V.padV + i * V.padPitch, V.padW, V.padD, true); });
    backSpots.forEach(function (s, i) { drawPad(s, 0.06 + i * V.backPitch, ROWS + V.backV, V.backW, V.backD, false); });

    // ── the doorways ─────────────────────────────────────────────────────────
    // Off the grid and off the floor plan, so drawn on the threshold itself —
    // and only once something stands there or the floor has run short enough
    // that it is about to.
    DOORS.forEach(function (id) {
      var stack = st.van[id], on = stack.length ? stack[stack.length - 1] : null;
      if (!on && !spaceIsTight(st)) return;
      var isSide = doorOf(id) === 'side';
      var u0 = isSide ? 2.02 : 0.4, v0 = isSide ? SIDE_DOOR_ROWS - 1.0 : ROWS - 0.02;
      var w = isSide ? 0.42 : 1.2, d = isSide ? 1.0 : 0.4;
      quad(P(u0, v0), mul(COL, w), mul(ROW, d),
        'background:' + (on ? 'rgba(255,181,112,.16)' : 'rgba(255,181,112,.05)')
        + ';box-shadow:inset 0 0 0 1px rgba(255,181,112,' + (on ? '.55' : '.24') + ');');
      chip(P(u0 + w / 2, v0 + d / 2, on ? 1.2 : 0),
        on ? CUST[on.cust].code + (on.n == null ? ' ?' : ' ' + on.n) : 'well',
        mono + 'font-size:' + fx(10 * k + 1) + 'px;font-weight:600;letter-spacing:.06em;color:#FFB570;');
    });

    return { box: 'position:absolute;left:' + fx(ox) + 'px;top:' + fx(oy) + 'px;width:0;height:0;', parts: parts,
             ox: ox, oy: oy, P: P,
             focus: focus, held: held, door: door, frontier: frontier, picked: picked,
             hosts: hosts, hostNow: hostNow, shut: shut };
  }

  // ── the dock ───────────────────────────────────────────────────────────────
  // Two rows. The top one is the loop the driver runs a hundred times a load and
  // its buttons never move; the bottom one is everything that ends something, so
  // Done sits 246px from Push in, at half the height and a different colour.
  // There are no confirmations anywhere on this board, so separation is the only
  // guard against a mis-tap, and Undo is beside the thing it undoes.
  consoleVals(st, accent, plan, S) {
    var self = this, focus = S.focus, held = S.held;
    var col = held ? CUST[held.cust].color : accent;
    function dockBox(tall) {
      return 'position:absolute;left:' + DOCK.x + 'px;top:' + DOCK.y + 'px;width:' + DOCK.w + 'px;'
        + 'height:' + (tall ? DOCK.h : DOCK.hShort) + 'px;padding:16px;border-radius:18px;'
        + 'display:flex;flex-direction:column;gap:8px;overflow:hidden;background:rgba(11,9,16,.92);'
        + 'border:2px solid ' + (focus ? col + '99' : '#241F30') + ';';
    }
    var big = 'font:700 19px/1 Archivo,system-ui,sans-serif;letter-spacing:-.02em;';
    var mid = 'font:700 16px/1 Archivo,system-ui,sans-serif;letter-spacing:-.02em;';
    var sub = "font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;opacity:.74;";
    var hist = this.state.hist.length;
    var undo = {
      undo: function () { self.undo(); },
      undoStyle: this.btn(hist ? 'quiet' : 'off', 60, accent) + 'width:102px;',
      undoLabel: hist ? 'Undo' : '—', undoBig: mid
    };

    if (!focus) {
      var waiting = expectedNext(st), off = this.btn('off', 76, accent) + 'width:0;padding:0;border:0;';
      return Object.assign({
        box: dockBox(false),
        eyebrow: waiting ? 'NOTHING ON A PACKING SPOT' : 'EVERY STOP CLOSED OUT',
        eyebrowStyle: "font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;color:"
          + (waiting ? '#8D87A0' : '#4FD6A8') + ';',
        note: '', noteStyle: 'font-size:0;',
        minus: noop, minusStyle: off,
        plus: noop, plusStyle: off, plusLabel: '', plusNote: '', plusBig: big, plusSub: sub,
        push: noop, pushStyle: off, pushLabel: '', pushNote: '', pushBig: big, pushSub: sub,
        top: noop, topStyle: this.btn('off', 60, accent) + 'width:0;padding:0;border:0;',
        topLabel: '', topNote: '', topBig: mid, topSub: sub,
        done: noop, doneStyle: this.btn('off', 60, accent) + 'width:0;padding:0;border:0;',
        doneLabel: '', doneBig: mid,
        showWhy: true,
        why: waiting ? 'Pick ' + CUST[waiting].name + ' on the right and say which door you are packing them at.'
          : positionsIn(st) + ' positions loaded. Nothing left to put in.',
        whyStyle: 'font:400 14px/1.4 "Space Grotesk",sans-serif;color:#8D87A0;'
      }, undo);
    }

    var spot = spotById(focus);
    var ps = pushState(st, focus, this.state.target);
    var take = this.topTake(st, focus);
    var tu = topUpState(st, focus, this.state.host, take);
    var forced = hostReason(st, focus);
    var suggest = ps.target ? suggestAt(st, ps.target) : null;

    var kind = 'go', label = ps.label, act;
    var note = ps.target ? posLabel(ps.target) + (held.n ? '' : ' · not counted') : '';
    var chosen = this.state.target;
    // The animation is decoration on a board that is already correct: the model
    // commits at tap time and the target already carries an accent outline, so a
    // driver whose eyes are on the crate never depends on seeing the motion.
    var flashFrom = spot.id;
    act = function () {
      var landed = null;
      self.apply(function (s) {
        if (ps.kind === 'doorway') landed = doDoorway(s, focus);
        else if (ps.kind === 'split') landed = doPush(s, focus, ps.take, chosen, ps.plan ? ps.plan.cells[1] : null);
        else landed = doPush(s, focus, null, chosen);
      });
      self.setState({ target: null, host: null, flash: landed ? { id: landed, from: flashFrom } : null });
    };
    if (ps.kind === 'ready')         { kind = held.n ? 'go' : 'quiet'; label = 'Push in' + (held.n ? ' ' + held.n : ''); }
    else if (ps.kind === 'chosen')   { kind = 'warn'; label = 'Push in' + (held.n ? ' ' + held.n : ''); }
    else if (ps.kind === 'split')    { kind = 'warn'; label = 'Push in ' + ps.take + ' of ' + held.n; }
    else if (ps.kind === 'order')    { kind = 'warn'; label = 'Push in anyway'; }
    else if (ps.kind === 'thin')     { kind = 'warn'; label = 'Push in anyway'; }
    else if (ps.kind === 'doorway')  { kind = ps.good ? 'go' : 'warn'; label = ps.label; note = posLabel(ps.target); }
    else if (ps.kind === 'nofit')    { kind = 'stop'; label = ps.label; act = noop; }
    else if (ps.kind === 'physical') {
      kind = 'stop'; label = ps.label; act = noop;
      // "Round the back" is an instruction, so it has to be a button. Without one
      // the board tells the driver what to do and gives them no way to record
      // having done it — and the order is stranded on a shut door.
      var other = spot.door === 'side' ? 'back' : 'side';
      var landing = freeSpotAt(st, other);
      if (landing) {
        kind = 'warn'; label = 'Carry round the back'; note = 'to ' + landing.name;
        act = function () {
          self.apply(function (s) { doMoveSpot(s, focus, other); });
          self.setState({ focus: landing.id, target: null, host: null, flash: null });
        };
      }
    }

    var showWhy = !!(ps.why || (forced && tu.kind !== 'nohost'));
    return Object.assign({
      box: dockBox(showWhy),
      eyebrow: spot.name + ' · ' + CUST[held.cust].name.toUpperCase(),
      eyebrowStyle: "font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;color:"
        + (S.picked ? '#FFB570' : col) + ';',
      note: (this.props.tier >= 3 && PALLETS[held.cust] ? 'pallet ' + PALLETS[held.cust] + ' · ' : '')
        + 'stop ' + stopOf(held.cust).i + ' of ' + STOPS.length
        + (this.props.tier >= 2 && COUNTS[held.cust] ? ' · ' + COUNTS[held.cust] + ' expected' : ''),
      noteStyle: "font:400 12px/1 'Space Grotesk',sans-serif;color:#5F5876;",

      minus: function () { self.apply(function (s) { doBump(s, focus, -1); }); },
      minusStyle: this.btn(held.n ? 'quiet' : 'off', 76, accent) + 'width:56px;font-size:22px;',
      plus: function () { self.apply(function (s) { doBump(s, focus, 1); }); },
      plusStyle: this.btn('quiet', 76, accent) + 'width:128px;',
      plusLabel: held.n ? '+ 1  (' + held.n + ')' : '+ 1 crate',
      plusNote: held.n ? 'on the spot' : (suggest ? 'or push ' + suggest + ' blind' : 'uncounted'),
      plusBig: big, plusSub: sub,

      push: act,
      pushStyle: this.btn(kind, 76, accent) + 'width:238px;',
      pushLabel: label, pushNote: note, pushBig: big, pushSub: sub,

      top: tu.kind === 'nohost' ? noop : function () {
        self.apply(function (s) { doStack(s, focus, tu.host.id, take); });
        self.setState({ host: null, flash: tu.host ? { id: tu.host.id, from: focus } : null });
      },
      topStyle: this.btn(tu.kind === 'nohost' ? 'off' : (forced ? 'warn' : 'quiet'), 60, accent) + 'width:208px;',
      topLabel: '+' + take + ' on top',
      topNote: tu.host ? posLabel(tu.host.id) : 'no stack for it', topBig: mid, topSub: sub,

      done: function () {
        self.apply(function (s) { doClose(s, focus); });
        self.setState({ focus: null, target: null, host: null, flash: null });
      },
      doneStyle: this.btn('quiet', 60, accent) + 'width:112px;', doneLabel: 'Done', doneBig: mid,

      // When the ±3 rule blocks the position AND a stack could take the crates
      // instead, both facts are load-bearing: one says why the ordinary move is
      // amber, the other says what the remedy costs. Showing only the first is
      // how the driver ends up mixing a stack without being told what mixing is.
      showWhy: showWhy,
      why: [ps.why, forced && tu.host
        ? (forced === 'space' ? 'The floor is running short. ' : '')
          + CUST[tu.host.below].name + '’s stack at ' + posLabel(tu.host.id) + ' would take them — '
          + 'but two customers on one stack is how the wrong crate gets carried into a building.'
        : ''].filter(function (x) { return x; }).join('  '),
      whyStyle: 'font:400 13px/1.35 "Space Grotesk",sans-serif;color:'
        + (kind === 'stop' ? '#F7768E' : '#FFB570') + ';'
        + 'display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;'
    }, undo);
  }

  renderVals() {
    var self = this;
    // The van is a setting, and there is more than one van. Reshape first, then
    // make the board's state fit the shape it just got.
    configure(this.props);
    var st = normalize(this.state.st);
    var tier = this.props.tier == null ? 1 : this.props.tier;
    var plan = tier >= 2 ? planAhead(COUNTS, st) : null;
    var accent = this.props.accent == null ? '#B48EF7' : this.props.accent;
    var S = this.scene(st, accent, plan);

    var free = positionsLeft(st, 'side') + positionsLeft(st, 'back');
    var sideLeft = positionsLeft(st, 'side');
    var doneStops = QUEUE.filter(function (k) { return st.closed[k]; }).length;
    var big = 'font:800 22px/1.15 Archivo,system-ui,sans-serif;letter-spacing:-.02em;color:';
    var stats = [
      { label: 'POSITIONS LEFT', value: positionsHeld(st) ? free + ' · ' + positionsHeld(st) + ' held' : String(free),
        style: big + (free ? '#F2EEF8' : '#F7768E') + ';' },
      { label: 'SIDE DOOR', value: sideLeft ? sideLeft + ' left' : 'shut', style: big + (sideLeft ? '#FFB570' : '#F7768E') + ';' },
      // cratesIn read 0 with five stacks aboard, because a blind push records an
      // unknown and (l.n || 0) scores an unknown as nothing. Positions is the
      // number that is always exact; the crate figure joins it only when every
      // position aboard was counted.
      { label: uncountedIn(st) ? 'POSITIONS IN' : 'CRATES IN',
        value: uncountedIn(st) ? positionsIn(st) + ' · ' + uncountedIn(st) + ' blind' : String(cratesIn(st)),
        style: big + '#CDC6DD;' },
      { label: 'STOPS', value: doneStops + ' / ' + QUEUE.length, style: big + '#CDC6DD;' }
    ];

    // ── the route, in loading order ──────────────────────────────────────────
    var doorBtn = 'width:62px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;'
      + "font:700 13px/1 'Space Grotesk',sans-serif;flex:none;";
    var queue = QUEUE.map(function (k) {
      var closed = !!st.closed[k], at = spotHolding(st, k), pos = positionsOf(st, k);
      var isFocus = at && at.id === S.focus;
      var state, col;
      var mine = 0, blind = false;
      pos.forEach(function (id) {
        st.van[id].forEach(function (l) {
          if (l.cust !== k) return;
          if (l.n == null) blind = true; else mine += l.n;
        });
      });
      if (closed) {
        state = !pos.length ? 'DONE · nothing aboard'
          : blind ? 'DONE · ' + pos.length + (pos.length === 1 ? ' position' : ' positions') + ' · uncounted'
          : 'DONE · ' + mine + ' in ' + pos.length + (pos.length === 1 ? ' position' : ' positions');
        col = '#4FD6A8';
      }
      else if (isFocus) { state = 'PACKING · ' + at.name; col = '#CBB0FF'; }
      else if (at) { state = 'ON ' + at.name; col = '#FFB570'; }
      else if (pos.length) { state = 'PART IN · ' + pos.map(posLabel).join(' '); col = '#8D87A0'; }
      else { state = 'STOP ' + stopOf(k).i + ' · WAITING'; col = '#5F5876'; }

      function door(d) {
        var bs = beginState(st, k, d);
        var tone = bs.kind === 'ready' ? (d === 'side' ? 'rgba(255,181,112,.10);border:1px solid rgba(255,181,112,.45);color:#FFB570'
                                                       : 'rgba(203,176,255,.10);border:1px solid rgba(180,142,247,.5);color:#CBB0FF')
          : bs.kind === 'packing' ? 'rgba(242,238,248,.05);border:1px solid ' + accent + '80;color:#F2EEF8'
          : bs.kind === 'move' ? 'rgba(203,176,255,.05);border:1px dashed rgba(180,142,247,.5);color:#CBB0FF'
          : bs.kind === 'well' || bs.kind === 'order' ? 'rgba(255,181,112,.07);border:1px dashed rgba(255,181,112,.45);color:#C09263'
          : 'rgba(242,238,248,.02);border:1px solid #201C2B;color:#3F3A52';
        return {
          style: doorBtn + 'background:' + tone + ';',
          label: bs.kind === 'move' ? 'move' : (d === 'side' ? 'side' : 'rear'),
          tap: (bs.kind === 'nospot' || bs.kind === 'shut') ? noop : function () {
            var landed = null;
            self.apply(function (s) { landed = doBegin(s, k, d); });
            self.setState({ focus: landed, target: null, host: null });
          }
        };
      }
      var sideB = door('side'), rearB = door('back');
      return {
        tap: function () { if (at) self.setState({ focus: at.id, target: null, host: null }); },
        tile: 'display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;cursor:pointer;'
          + 'flex:1 1 0;min-height:62px;max-height:96px;'
          + 'background:' + (isFocus ? '#191524' : '#0E0C14') + ';border:1px solid '
          + (isFocus ? accent + '80' : (closed ? 'rgba(79,214,168,.22)' : '#1B1826')) + ';',
        barStyle: 'width:8px;align-self:stretch;border-radius:3px;flex:none;background:' + CUST[k].color + (closed ? '55' : ''),
        name: CUST[k].name,
        nameStyle: 'font:700 15px/1.15 Archivo,system-ui,sans-serif;letter-spacing:-.02em;overflow:hidden;'
          + 'text-overflow:ellipsis;white-space:nowrap;color:' + (closed || at ? '#F2EEF8' : '#8D87A0') + ';',
        state: state,
        stateStyle: "font:500 11px/1.2 'IBM Plex Mono',monospace;letter-spacing:.05em;color:" + col + ';'
          + 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;',
        hasDoors: !closed, hasReopen: closed,
        side: sideB.tap, sideStyle: sideB.style, sideLabel: sideB.label,
        rear: rearB.tap, rearStyle: rearB.style, rearLabel: rearB.label,
        reopen: function () { self.apply(function (s) { doReopen(s, k); }); },
        reopenStyle: 'width:129px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;'
          + "font:600 13px/1 'Space Grotesk',sans-serif;flex:none;background:rgba(242,238,248,.03);color:#4A445C;"
      };
    });

    // ── the two ways this goes wrong before anybody notices ──────────────────
    // Both are counts crossing, and both are only fixable while there is still
    // a choice — so they are said the moment they cross, not when they bite.
    var lines = [];
    // Loudest first: this one is not a forecast, it is a statement about crates
    // that are already in the van in an order that will cost an unload.
    depthFaults(st).slice(0, 2).forEach(function (f) {
      lines.push(CUST[f.deepCust].name + ' at ' + posLabel(f.deep) + ' is deeper than '
        + CUST[f.shallowCust].name + ' at ' + posLabel(f.shallow) + ', and comes out first — '
        + CUST[f.shallowCust].name + ' has to come off to reach them.');
    });
    // The side door shutting on stacks that are still standing at it. Naming the
    // shortfall is not the same as naming who it lands on: the stacks go in in
    // loading order, so the ones past the position count are the ones stranded.
    var queued = SPOTS.filter(function (sp) { return sp.door === 'side' && st.staged[sp.id]; })
      .sort(function (a, b) {
        return QUEUE.indexOf(st.staged[a.id].cust) - QUEUE.indexOf(st.staged[b.id].cust);
      });
    var stranded = queued.slice(sideLeft);
    if (stranded.length) {
      lines.push(sideLeft + ' position' + (sideLeft === 1 ? '' : 's') + ' left through the side door and '
        + queued.length + ' stacks standing at it — '
        + listOf(stranded.map(function (sp) { return sp.name + ' (' + CUST[st.staged[sp.id].cust].short + ')'; }))
        + ' will have to be carried round.');
    }
    var notInYet = QUEUE.filter(function (x) { return !st.closed[x] && !isAboard(st, x); }).length;
    if (free < notInYet) {
      lines.push(free + ' position' + (free === 1 ? '' : 's') + ' left and ' + notInYet
        + ' stops with nothing aboard — some will have to share a stack.');
    }
    var warn = {
      show: lines.length > 0,
      text: lines.join('  '),
      style: 'padding:9px 12px;border-radius:11px;flex:none;font:400 12.5px/1.35 "Space Grotesk",sans-serif;'
        + 'background:rgba(247,118,142,.09);border:1px solid rgba(247,118,142,.35);color:#F7768E;'
    };

    var toolBig = "font:700 15px/1 'Space Grotesk',sans-serif;";
    var toolSub = "font:400 10px/1 'IBM Plex Mono',monospace;letter-spacing:.07em;opacity:.7;";
    var tools = [
      { label: '⚑ Odd crate', sub: st.flags ? st.flags + ' flagged' : 'unlabelled or off route',
        tap: function () { self.apply(function (s) { s.flags = (s.flags || 0) + 1; }); },
        style: this.btn(st.flags ? 'warn' : 'quiet', 58, accent) + 'width:184px;',
        bigStyle: toolBig, subStyle: toolSub },
      { label: '❄ Freeze', sub: st.frozenAtDoor ? 'side well' : 'none today',
        tap: function () { self.apply(function (s) { s.frozenAtDoor = !s.frozenAtDoor; }); },
        style: this.btn(st.frozenAtDoor ? 'quiet' : 'off', 58, accent) + 'width:186px;',
        bigStyle: toolBig, subStyle: toolSub }
    ];

    // Consumed here rather than through setState: a second paint would replay
    // the animation, and every other action would replay it again after that.
    this.state.flash = null;

    return {
      head: { title: 'Stavanger Route',
              sub: 'WED 19 AUG · ' + STOPS.length + ' STOPS · '
                + (tier === 1 ? 'ROUTE ONLY' : (tier === 2 ? 'COUNTS KNOWN' : 'FULLY SCANNED')) },
      stats: stats,
      scene: { box: S.box, parts: S.parts },
      con: this.consoleVals(st, accent, plan, S),
      queue: queue, warn: warn, tools: tools
    };
  }
}


COMPONENT = new Component({ tier: 1, accent: '#B48EF7' });

document.querySelectorAll('[data-tier]').forEach(function (b) {
  b.addEventListener('click', function () {
    COMPONENT.props.tier = Number(b.dataset.tier);
    paint();
  });
});
document.getElementById('reset').addEventListener('click', function () {
  var tier = COMPONENT.props.tier;
  COMPONENT = new Component({ tier: tier, accent: '#B48EF7' });
  paint();
});

function fit() {
  var s = Math.min(1, (window.innerWidth - 24) / 1440);
  document.getElementById('scaler').style.transform = 'scale(' + s + ')';
  document.getElementById('stage').style.height = (840 * s) + 'px';
}
window.addEventListener('resize', fit);
fit();
paint();
</script>
</body>
</html>
