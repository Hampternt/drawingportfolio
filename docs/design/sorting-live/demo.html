<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van load board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; }
    a { color: #CBB0FF; } a:hover { color: #DED0FF; }
    * { box-sizing: border-box; }
    /* A stack arriving in the van slides from the spot it was built on.
       `translate` is an independent transform property, so it composes OUTSIDE
       the sheared `transform` the stack already carries and leaves the matrix
       alone. The runtime rebuilds the tree on every paint, and a freshly created
       element always starts its animation — so the full re-render is what drives
       this rather than what breaks it. */
    @keyframes sc-push { from { translate: var(--dx) var(--dy); } to { translate: 0 0; } }
  </style>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #07060B; color: #CDC6DD;
               font-family: "Space Grotesk", system-ui, sans-serif; }
  body { overflow: hidden; }
  /* Authored at exactly 90rem x 52.5rem — 1440 x 840 at the browser's default
     16px, the Movink Pad Pro in landscape after the URL bar. The chrome bar and
     the board are one fixed-aspect drawing measured in that one unit, so the
     layout at any size is the same layout rather than a reflowed one, and fit()
     resizes the lot by setting the root font size. Nothing here is in pixels;
     that is what makes a single number enough. */
  #stage { display: flex; align-items: center; justify-content: center;
           min-height: 100vh; min-height: 100dvh; overflow: hidden; }
  #page { width: 90rem; flex: none; }
  #chrome { display: flex; gap: 0.625rem; align-items: stretch;
            padding: 0.75rem 1rem; border-bottom: 0.0625rem solid #1A1723; background: #0B0910; }
  #chrome h1 { font-family: Archivo, system-ui, sans-serif; font-size: 0.9375rem; font-weight: 800;
               letter-spacing: -0.02em; color: #F2EEF8; margin: 0; align-self: center;
               padding-right: 0.5rem; white-space: nowrap; }
  .tier { flex: 1 1 15rem; min-width: 0; text-align: left; cursor: pointer;
          background: #0E0C14; border: 0.0625rem solid #262232; border-radius: 0.6875rem;
          padding: 0.5625rem 0.75rem; color: #8D87A0; font: inherit; display: flex;
          flex-direction: column; gap: 0.125rem; }
  .tier b { font-family: Archivo, system-ui, sans-serif; font-size: 0.875rem; color: #CDC6DD; }
  .tier span { font-size: 0.71875rem; line-height: 1.35; color: #5F5876; }
  .tier.on { background: #17141F; border-color: #B48EF7; }
  .tier.on b { color: #F2EEF8; }
  .tier.on span { color: #8D87A0; }
  .shell { align-self: center; cursor: pointer; background: rgba(242,238,248,.05);
           border: 0.0625rem solid #262232; border-radius: 0.625rem; color: #CDC6DD;
           font: inherit; font-size: 0.8125rem; padding: 0.625rem 1rem; white-space: nowrap; }
  /* Full screen drops the tier descriptions rather than the tier buttons: the
     bar goes from three lines to one and hands the board the difference, and
     the only way back out of the demo is still on screen. */
  body.big .tier span { display: none; }
  #board { width: 90rem; height: 52.5rem; }
</style>
</head>
<body>

<div id="stage"><div id="page">

  <div id="chrome">
    <h1>Live board</h1>
      <button class="tier" data-tier="1"><b>Customer order only</b><span>The route list and nothing else. Every count, every position and every stack height gets decided at the pallet.</span></button>
      <button class="tier" data-tier="2"><b>Order + crate counts</b><span>Weighed or scanned totals per customer. The board plans the whole van up front and shows what belongs where before anything is lifted.</span></button>
      <button class="tier" data-tier="3"><b>Everything scanned</b><span>Counts plus which pallet each order is buried in, so the board can also say what to pull next and from where.</span></button>
    <button id="full" class="shell">Full screen</button>
    <button id="reset" class="shell">Start over</button>
  </div>

  <div id="board"></div>

</div></div>

<template id="board-template">
<div style="width: 90rem; height: 52.5rem; background: #0B0910; color: #CDC6DD; position: relative; overflow: hidden; font-size: 1rem;">

  <!-- ── the van, drawn from its rear right corner ───────────────────────────
       Every piece of the picture is one absolutely positioned div carrying its
       own transform, emitted back to front, so paint order is depth order and
       no z-index is needed. Floor tiles and stack faces are sheared; anything
       with words in it is a separate upright chip, because sheared text is
       unreadable and this is read at arm's length in the rain. -->
  <div style="{{scene.box}}">
    <sc-for list="{{scene.parts}}" as="p" hint-placeholder-count="40">
      <div onClick="{{p.tap}}" style="{{p.style}}"><sc-for list="{{p.kids}}" as="k" hint-placeholder-count="4"><div style="{{k.style}}"></div></sc-for>{{p.text}}</div>
    </sc-for>
  </div>

  <!-- ── header ─────────────────────────────────────────────────────────────
       Over the empty corner the diagonal leaves at the top left. -->
  <div style="position: absolute; left: 1.5rem; top: 0.875rem; display: flex; align-items: center; gap: 0.875rem;">
    <div onClick="{{head.back}}" style="width: 2.625rem; height: 2.625rem; border: 0.0625rem solid #262232; border-radius: 0.625rem; display: flex; align-items: center; justify-content: center; color: #8D87A0; font-size: 1.1875rem; flex: none;">&#8592;</div>
    <div style="display: flex; flex-direction: column; gap: 0.0625rem;">
      <div style="font: 800 1.1875rem/1.2 Archivo, system-ui, sans-serif; letter-spacing: -0.025em; color: #F2EEF8;">{{head.title}}</div>
      <div style="font: 500 0.6875rem/1.4 'IBM Plex Mono', monospace; letter-spacing: 0.09em; color: #8D87A0;">{{head.sub}}</div>
    </div>
    <div style="display: flex; gap: 1.375rem; margin-left: 1.5rem;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 0.125rem;">
          <span style="font: 500 0.625rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.09em; color: #5F5876; white-space: nowrap;">{{s.label}}</span>
          <span style="{{s.style}}">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- ── the dock ───────────────────────────────────────────────────────────
       Standing on the pavement wedge between the two clusters of packing spots,
       tethered by a line to whichever one it is driving. The top row is the loop
       the driver runs a hundred times a load and its buttons never move; the
       bottom row is everything that ends something. -->
  <div style="{{con.box}}">
    <div style="display: flex; align-items: baseline; gap: 0.5625rem; min-width: 0; flex: none;">
      <span style="{{con.eyebrowStyle}}">{{con.eyebrow}}</span>
      <span style="{{con.noteStyle}}">{{con.note}}</span>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: stretch; flex: none;">
      <div onClick="{{con.minus}}" style="{{con.minusStyle}}">&#8722;</div>
      <div onClick="{{con.plus}}" style="{{con.plusStyle}}">
        <span style="{{con.plusBig}}">{{con.plusLabel}}</span>
        <span style="{{con.plusSub}}">{{con.plusNote}}</span>
      </div>
      <div onClick="{{con.push}}" style="{{con.pushStyle}}">
        <span style="{{con.pushBig}}">{{con.pushLabel}}</span>
        <span style="{{con.pushSub}}">{{con.pushNote}}</span>
      </div>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: stretch; flex: none;">
      <div onClick="{{con.top}}" style="{{con.topStyle}}">
        <span style="{{con.topBig}}">{{con.topLabel}}</span>
        <span style="{{con.topSub}}">{{con.topNote}}</span>
      </div>
      <div onClick="{{con.done}}" style="{{con.doneStyle}}"><span style="{{con.doneBig}}">{{con.doneLabel}}</span></div>
      <div onClick="{{con.undo}}" style="{{con.undoStyle}}"><span style="{{con.undoBig}}">{{con.undoLabel}}</span></div>
    </div>
    <sc-if value="{{con.showWhy}}" hint-placeholder-val="{{true}}">
      <div style="{{con.whyStyle}}">{{con.why}}</div>
    </sc-if>
  </div>

  <!-- ── the route, in loading order ────────────────────────────────────────
       Reverse of delivery: the last drop goes in first and ends up deepest.
       Each stop says which door to pack it at, because that is the only choice
       the board cannot make for you. -->
  <div style="position: absolute; right: 1rem; top: 0.875rem; width: 23.5rem; height: 50.75rem; display: flex; flex-direction: column; gap: 0.375rem;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 0.1875rem 0.125rem; flex: none;">
      <span style="font: 600 0.6875rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.10em; color: #8D87A0;">LOADING ORDER</span>
      <span style="font: 400 0.6875rem/1 'Space Grotesk', sans-serif; color: #5F5876;">last delivery in first</span>
    </div>

    <sc-for list="{{queue}}" as="q" hint-placeholder-count="6">
      <div onClick="{{q.tap}}" style="{{q.tile}}">
        <div style="{{q.barStyle}}"></div>
        <div style="display: flex; flex-direction: column; gap: 0.0625rem; flex: 1 1 0; min-width: 0;">
          <span style="{{q.nameStyle}}">{{q.name}}</span>
          <span style="{{q.stateStyle}}">{{q.state}}</span>
        </div>
        <sc-if value="{{q.hasDoors}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; gap: 0.3125rem; flex: none;">
            <div onClick="{{q.side}}" style="{{q.sideStyle}}">{{q.sideLabel}}</div>
            <div onClick="{{q.rear}}" style="{{q.rearStyle}}">{{q.rearLabel}}</div>
          </div>
        </sc-if>
        <sc-if value="{{q.hasReopen}}" hint-placeholder-val="{{false}}">
          <div onClick="{{q.reopen}}" style="{{q.reopenStyle}}">reopen</div>
        </sc-if>
      </div>
    </sc-for>

    <div style="flex: 1 1 0; min-height: 0;"></div>

    <sc-if value="{{warn.show}}" hint-placeholder-val="{{false}}">
      <div style="{{warn.style}}">{{warn.text}}</div>
    </sc-if>

    <div style="display: flex; gap: 0.375rem; flex: none;">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
        <div onClick="{{t.tap}}" style="{{t.style}}">
          <span style="{{t.bigStyle}}">{{t.label}}</span>
          <span style="{{t.subStyle}}">{{t.sub}}</span>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</template>

<template id="settings-template">
<div style="width: 90rem; height: 52.5rem; background: #0B0910; color: #CDC6DD; position: relative; overflow: hidden; font-size: 1rem;">

  <div style="position: absolute; left: 1.5rem; top: 1rem; display: flex; flex-direction: column; gap: 0.0625rem;">
    <div style="font: 800 1.375rem/1.2 Archivo, system-ui, sans-serif; letter-spacing: -0.025em; color: #F2EEF8;">{{title}}</div>
    <div style="font: 500 0.6875rem/1.4 'IBM Plex Mono', monospace; letter-spacing: 0.09em; color: #8D87A0;">{{sub}}</div>
  </div>
  <div style="position: absolute; right: 1.5rem; top: 1.125rem; display: flex; gap: 0.5rem;">
    <div onClick="{{reset}}" style="{{resetStyle}}">{{resetLabel}}</div>
    <div onClick="{{back}}" style="{{backStyle}}">{{backLabel}}</div>
  </div>

  <!-- ── the settings ───────────────────────────────────────────────────────
       Two columns: the numbers that describe the van on the left, and what the
       board should reach for on the right. Every row here was already a
       parameter or a constant — the screen is what makes it the driver's. -->
  <sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
    <div style="{{col.style}}">
      <sc-for list="{{col.sections}}" as="sec" hint-placeholder-count="2">
        <div style="{{sec.style}}">
          <span style="{{sec.titleStyle}}">{{sec.title}}</span>
          <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="5">
            <div style="{{r.tile}}">
              <div style="display: flex; flex-direction: column; gap: 0.125rem; flex: 1 1 0; min-width: 0;">
                <span style="{{r.nameStyle}}">{{r.name}}</span>
                <span style="{{r.noteStyle}}">{{r.note}}</span>
              </div>
              <sc-if value="{{r.isStep}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; align-items: center; gap: 0.375rem; flex: none;">
                  <div onClick="{{r.dec}}" style="{{r.decStyle}}">&#8722;</div>
                  <span style="{{r.valueStyle}}">{{r.value}}</span>
                  <div onClick="{{r.inc}}" style="{{r.incStyle}}">+</div>
                </div>
              </sc-if>
              <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{false}}">
                <div onClick="{{r.toggle}}" style="{{r.toggleStyle}}">{{r.toggleLabel}}</div>
              </sc-if>
              <sc-if value="{{r.isRank}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; gap: 0.375rem; flex: none;">
                  <div onClick="{{r.up}}" style="{{r.upStyle}}">&#8593;</div>
                  <div onClick="{{r.down}}" style="{{r.downStyle}}">&#8595;</div>
                </div>
              </sc-if>
              <sc-if value="{{r.isFixed}}" hint-placeholder-val="{{false}}">
                <span style="{{r.markStyle}}">{{r.mark}}</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </sc-for>

  <!-- ── the van these settings make ────────────────────────────────────────
       Drawn from the live session, so the shape on the right is the shape the
       next crate goes into rather than an illustration of one. -->
  <div style="position: absolute; left: 56rem; top: 6.5rem; width: 32.5rem; display: flex; justify-content: space-between;">
    <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 0.125rem;">
        <span style="{{f.labelStyle}}">{{f.label}}</span>
        <span style="{{f.valueStyle}}">{{f.value}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 56rem; top: 46rem; width: 32.5rem; display: flex; flex-direction: column; gap: 0.375rem;">
    <span style="font: 400 0.75rem/1.4 'Space Grotesk', sans-serif; color: #5F5876;">The van drawn here is the one in the session, so a shape that would drop a loaded position is not offered — the steppers stop instead.</span>
    <span style="{{savedStyle}}">{{saved}}</span>
  </div>
  <div style="{{preview.box}}">
    <sc-for list="{{preview.parts}}" as="p" hint-placeholder-count="40">
      <div style="{{p.style}}"><sc-for list="{{p.kids}}" as="k" hint-placeholder-count="4"><div style="{{k.style}}"></div></sc-for>{{p.text}}</div>
    </sc-for>
  </div>

</div>
</template>

<script>
// ── a very small template runtime ────────────────────────────────────────────
// Renders the same markup the artboards use — {{dotted.path}} holes, <sc-for>,
// <sc-if>, onClick handlers — so the demo and the design cannot drift. The
// markup lives in an inert <template>, which is what stops the browser trying
// to compile onClick as script.
function resolve(scope, path) {
  return String(path).split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
}
function interp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, function (_, p) {
    var v = resolve(scope, p.trim());
    return v == null ? '' : String(v);
  });
}
function hole(attr) { return String(attr).replace(/\{\{|\}\}/g, '').trim(); }

function build(node, scope) {
  if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, scope))];
  if (node.nodeType !== 1) return [];
  var tag = node.tagName.toLowerCase(), out = [];

  if (tag === 'sc-for') {
    var list = resolve(scope, hole(node.getAttribute('list'))) || [];
    var as = node.getAttribute('as');
    list.forEach(function (item) {
      var inner = Object.create(scope);
      inner[as] = item;
      Array.prototype.forEach.call(node.childNodes, function (c) { out = out.concat(build(c, inner)); });
    });
    return out;
  }
  if (tag === 'sc-if') {
    if (!resolve(scope, hole(node.getAttribute('value')))) return [];
    Array.prototype.forEach.call(node.childNodes, function (c) { out = out.concat(build(c, scope)); });
    return out;
  }

  var el = document.createElement(tag);
  Array.prototype.forEach.call(node.attributes, function (a) {
    if (a.name.toLowerCase() === 'onclick') {
      var fn = resolve(scope, hole(a.value));
      if (typeof fn === 'function') {
        el.style.cursor = 'pointer';
        el.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); fn(); });
      }
      return;
    }
    el.setAttribute(a.name, interp(a.value, scope));
  });
  Array.prototype.forEach.call(node.childNodes, function (c) {
    build(c, scope).forEach(function (n) { el.appendChild(n); });
  });
  return [el];
}

// ── the shim the board's logic is written against ────────────────────────────
// ON_PAINT is how anything outside the render loop finds out that state changed
// — the demo hangs its settings persistence on it. Left null, nothing happens.
// BOARD_HOST is the element the tree is painted into. The demo has one board
// on an otherwise empty page and calls it `board`; the app's page is a whole
// site around it and names it something that could only be this.
var COMPONENT = null, PENDING = false, ON_PAINT = null, BOARD_HOST = 'board';
class DCLogic {
  constructor(props) { this.props = props || {}; }
  setState(o) { Object.assign(this.state, o); schedule(); }
}
function schedule() {
  if (PENDING) return;
  PENDING = true;
  requestAnimationFrame(function () { PENDING = false; paint(); });
}
function paint() {
  var host = document.getElementById(BOARD_HOST);
  var vals = COMPONENT.renderVals();
  // The board and the settings are two screens against one component, so the
  // values say which markup they are for rather than the caller guessing.
  var tpl = document.getElementById((vals.screen || 'board') + '-template');
  host.textContent = '';
  Array.prototype.forEach.call(tpl.content.childNodes, function (c) {
    build(c, vals).forEach(function (n) { host.appendChild(n); });
  });
  document.querySelectorAll('[data-tier]').forEach(function (b) {
    b.classList.toggle('on', Number(b.dataset.tier) === (COMPONENT.props.tier || 1));
  });
  if (ON_PAINT) ON_PAINT();
}

// ── where the settings live between mornings ─────────────────────────────────
// Browser-only, and the only file here that is: model.js and board.js run under
// node in the tests and must stay that way.
//
// localStorage is not always there. A private window, cookies blocked, or a
// browser set to refuse site data can make even the property access throw — so
// every path in here fails to "no stored settings" rather than to a blank
// screen. The board is worth more than the preferences.
var SETTINGS_KEY = 'sorting-live.settings';

function storageWorks() {
  try {
    var probe = SETTINGS_KEY + '.probe';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return true;
  } catch (e) { return false; }
}
function loadStored() {
  try { return window.localStorage.getItem(SETTINGS_KEY); } catch (e) { return null; }
}
// null removes the key, so a board back on its defaults leaves nothing behind
// and a fresh browser and a reset one are the same browser.
function saveStored(text) {
  try {
    if (text === null) window.localStorage.removeItem(SETTINGS_KEY);
    else window.localStorage.setItem(SETTINGS_KEY, text);
    return true;
  } catch (e) { return false; }
}

// ── Live mode ────────────────────────────────────────────────────────────────
// No manifest, no generated plan, no crate counts. The only input is the stop
// list. Every rule the generator used to settle up front has to be enforced
// live instead, at the moment of the tap.
// A third length, for cells too narrow to hold a name — nine positions across
// 1440px leaves about seventy pixels for text.
//
// It has to be derived from the actual stop list, never hashed per name: three
// letters of the first word renders "Rema 1000 Hillevåg" and "Rema 1000 Madla"
// identically, and on this board a code is what you read before you carry crates
// into a building. Collisions lengthen until they separate.
function makeCodes(names) {
  var keys = Object.keys(names), out = {}, used = {}, W = {};
  function words(x) {
    return String(x).toUpperCase().replace(/[^A-ZÆØÅ0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);
  }
  keys.forEach(function (k) { W[k] = words(names[k]); });

  // Group by the first word, because that is what collides — a street of Rema
  // 1000s, three Coops, two Jåtten somethings.
  var groups = {};
  keys.forEach(function (k) {
    var g = (W[k][0] || '').slice(0, 3);
    (groups[g] = groups[g] || []).push(k);
  });

  keys.forEach(function (k) {
    var w = W[k], first = w[0] || String(k), head = first.slice(0, 3), c = [];
    if ((groups[head] || []).length > 1) {
      // The shared word carries no information, so build the code out of the
      // word that does — skipping bare numbers, which "Rema 1000" is full of.
      var tail = w.slice(1).filter(function (t) { return !/^[0-9]+$/.test(t); });
      var d = tail[0] || w[1] || '';
      c.push(first.slice(0, 1) + d.slice(0, 2));
      c.push(first.slice(0, 1) + d.slice(0, 3));
      c.push(first.slice(0, 2) + d.slice(0, 2));
      c.push(head + d.slice(0, 1));
      if (tail[1]) c.push(first.slice(0, 1) + tail[1].slice(0, 2));
    }
    c.push(head, first.slice(0, 4), head + (w[1] || '').slice(0, 1));

    var pick = null;
    for (var i = 0; i < c.length && !pick; i++) if (c[i] && c[i].length >= 2 && !used[c[i]]) pick = c[i];
    if (!pick) {                       // never collide: number them rather than repeat
      var base = head || 'X', n = 2;
      while (used[base + n]) n++;
      pick = base + n;
    }
    used[pick] = true;
    out[k] = pick;
  });
  return out;
}

// ── the route ────────────────────────────────────────────────────────────────
// In delivery order: stop 1 is delivered first. Loading runs the other way — the
// last delivery goes in first and ends up deepest, against the cab — which is
// what QUEUE is.
//
// This is the demo's route. `configureRoute()` installs a real one, and every
// rule below reads whatever is installed rather than these six names.
var DEMO_ROUTE = [
  { key: 'MAR', name: 'Marlink',          short: 'Marlink',     color: '#4FD6A8', count: 3,  pallet: 'B' },
  { key: 'FRO', name: 'Frøystad',         short: 'Frøystad',    color: '#B48EF7', count: 4,  pallet: 'A' },
  { key: 'SVE', name: 'Sverdrup Steel',   short: 'Sverdrup',    color: '#7AA2F7', count: 7,  pallet: 'A' },
  { key: 'HIN', name: 'Hinna',            short: 'Hinna',       color: '#F7768E', count: 2,  pallet: 'C' },
  { key: 'JAT', name: 'Jåtten Skole',     short: 'Jåtten',      color: '#FFB570', count: 5,  pallet: 'C' },
  { key: 'OLA', name: 'Olavstoppen',      short: 'Olavstoppen', color: '#6FBF97', count: 10, pallet: 'B' }
];

// When a plan carries no colour of its own. Cycled rather than hashed: a hash
// gives two stops on the same morning the same colour often enough to matter,
// and this board is read by colour before it is read by name. Past the end of
// the list it repeats, which is honest — a route longer than this is a route
// where two stops share a colour, not one where a stop has none.
var ROUTE_COLORS = ['#6FBF97', '#FFB570', '#F7768E', '#7AA2F7', '#B48EF7', '#4FD6A8',

    // drew a confident blue ghost onto every empty position for crates that
    // were already in the van. With no count there is nothing to subtract, so
    // there is nothing honest to plan: say so instead.

    while (left > 0 && guard++ < 40) {

      var target = resolveTarget(st, door, null, cust);
      if (!target) break;

      // split spread it. Without this, Sverdrup's 7 sits four above Marlink's 3.

        .map(function (k) { return counts[k] || 0; }).filter(function (v) { return v > 0; });
      var cap = w.hi;
      if (ahead.length) cap = Math.min(cap, Math.min.apply(null, ahead) + STAB);
      if (left > cap && left <= cap * 4) take = cap;
      if (left > cap) {

        // rather than a leftover: 7 under a cap of 6 comes out 4 + 3, not 6 + 1.
        var plan = splitPlan(st, left, target, cap);

// ── depth order ──────────────────────────────────────────────────────────────

// about the SEQUENCE of taps, and one tap of Done dissolves it — so it never
// catches the case that matters, which is the two doors worked in parallel:
//

// Who this door is waiting for. A stop being packed at the OTHER door is not

// ── the push-in guard ────────────────────────────────────────────────────────
// Two kinds of no. PHYSICAL is a hard stop: the van cannot do it. Everything
// else is the user's call — amber, allowed, and the cost spelled out.

  if (!target) {
    if (spot.door === 'side') {

      // would have to travel past what is already aboard. So it gets carried
      // round to the back, and the well is only the answer when there is no
      // back left to carry it to. A single crate is the exception: it belongs
      // at the side door anyway, and walking it round the van earns nothing.
      if (doorwayFree(st, 'side') && ((RULES.singleCrateWell && held.n === 1) || spaceIsTight(st))) return doorwayState(st, spotId);
      return { kind: 'physical', label: 'Round the back',
        why: 'Rows 1–' + SIDE_DOOR_ROWS + ' are full, so nothing more goes in this way — it would have to '
          + 'travel past what is already aboard. Carry this round to the back.' };

      why: 'Every position and both doorways are taken. Nothing left to put it in.' };

  }

        + stopOf(fault.cust).i + '. Putting ' + CUST[held.cust].name + ' '
        + (fault.deeper ? 'in front of them at ' : 'deeper than them at ') + posLabel(target)

  // one row further out, and this stack is then deeper than part of them.
  //

  //   and at stop 5 you reach past OLA at R2·L to get JAT at R1·R.
  //

  // the tap that clears it.

  // thing depthFaultAt above cannot see. So it fires when the stop being
  // skipped is still standing on a spot — unfinished, more of them coming, and
  // that next stack lands further out than this one — or when nothing of theirs

  // it, and saying it again is noise on a board that is doing fine.

  if (RULES.orderGuard && want && want !== held.cust && (at || !isAboard(st, want))) {
    var why = at
      ? CUST[want].name + ' goes in first — they are on ' + at.name + '.'
      : CUST[want].name + ' has not been staged — push this and it lands in front of them.';

  }

      return { kind: 'split', target: target, take: plan.heights[0], plan: plan,
        label: 'Push in ' + plan.heights[0] + ' of ' + held.n,
        why: 'All ' + held.n + ' will not stand at ' + posLabel(target) + ' — ' + w.hi
           + ' is its ceiling. Split it ' + plan.heights.join(' + ') + ': '
           + plan.cells.map(posLabel).join(', then ') + '.' };
    }

      why: held.n + ' cannot be made to step down from ' + posLabel(target)

         + ' — ' + tall.apart + ' apart, and ' + w.lo + ' is the floor here.'
         + (w.boxedIn ? ' No height works at ' + posLabel(target)

// ── beginning a customer ─────────────────────────────────────────────────────

}

  }

  return to.id;

// Only ever derived from something real: the stack this one has to ramp off in
// its own column, clamped into the window. With nothing behind it there is

// than a fallback: a stop with two crates does not need a position of its own

// ── actions ──────────────────────────────────────────────────────────────────

  var van = {}; ALL_POS.forEach(function (id) { van[id] = []; });
  var staged = {}; SPOTS.forEach(function (s) { staged[s.id] = null; });

  var staged = {}; SPOTS.forEach(function (s) { staged[s.id] = st.staged[s.id] ? { cust: st.staged[s.id].cust, n: st.staged[s.id].n } : null; });
  var closed = {}; Object.keys(st.closed).forEach(function (k) { closed[k] = true; });
  var held = {}; Object.keys(st.held || {}).forEach(function (k) { held[k] = st.held[k]; });

          + (on ? 'background:rgba(79,214,168,.14);border:0.0625rem solid rgba(79,214,168,.5);color:#4FD6A8;'
                : 'background:rgba(242,238,248,.03);border:0.0625rem solid #2A2438;color:#5F5876;'),
        toggleLabel: on ? 'on' : 'off'
      });
    }
    function rankRow(name, note, i, len, move) {
      return Object.assign({}, blank, {
        tile: rowTile, name: (i + 1) + '.  ' + name, nameStyle: nameStyle, note: note, noteStyle: noteStyle,
        isRank: true,
        up: i > 0 ? function () { move(i, -1); } : noop, upStyle: pill(i > 0),
        down: i < len - 1 ? function () { move(i, 1); } : noop, downStyle: pill(i < len - 1)
      });
    }
    function fixedRow(name, note) {
      return Object.assign({}, blank, {
        tile: rowTile + 'opacity:.72;', name: name, nameStyle: nameStyle, note: note, noteStyle: noteStyle,
        isFixed: true, mark: 'always on',
        markStyle: mono + 'font-size:0.6875rem;letter-spacing:.08em;color:#4FD6A8;flex:none;'
      });
    }

    var nSide = SPOTS.filter(function (x) { return x.door === 'side'; }).length;
    var nBack = SPOTS.filter(function (x) { return x.door === 'back'; }).length;
    var PRI = { own: ['A position of its own', 'the safe default — one customer, one position'],
      well: ['The door well', 'reachable, but a stack standing in it blocks the door'],
      top: ['On top of another stop', 'saves a position, and is how the wrong goods get carried in'] };
    var pri = (RULES.priority || []).slice();
    var movePri = function (i, d) {
      var next = pri.slice(), t = next[i];
      next[i] = next[i + d]; next[i + d] = t;
      setRule('priority', next);
    };

    var colStyle = 'display:flex;flex-direction:column;gap:1rem;';
    var sectionStyle = 'display:flex;flex-direction:column;gap:0.375rem;';
    var titleStyle = mono + 'font-size:0.6875rem;font-weight:600;letter-spacing:.11em;color:#8D87A0;padding-left:0.125rem;';
    var cols = [
      { style: 'position:absolute;left:1.5rem;top:6.5rem;width:26.625rem;' + colStyle, sections: [
        { title: 'THE VAN', titleStyle: titleStyle, style: sectionStyle, rows: [
          step('Rows', minRows > 1 ? 'deepest row in use is ' + minRows : 'front to back', ROWS,
            Math.max(5, minRows), 12, function (v) { setProp('rows', v); }),
          step('Stack height', minCap > 1 ? 'tallest stack aboard is ' + minCap : 'the roof', CAP,
            Math.max(4, minCap), 10, function (v) { setProp('capacity', v); }),
          step('Side door reaches', 'rows 1–N; 0 is a van without one', SIDE_DOOR_ROWS, 0, ROWS,
            function (v) { setProp('sideDoorRows', v); },
            function (v) { return v ? '1–' + v : 'none'; }),
          step('Packing spots, side', heldAt('side') ? heldAt('side') + ' holding something' : 'on the kerb',
            nSide, Math.max(0, heldAt('side')), 4, function (v) { setProp('sideSpots', v); }),
          step('Packing spots, back', heldAt('back') ? heldAt('back') + ' holding something' : 'behind the doors',
            nBack, Math.max(0, heldAt('back')), 3, function (v) { setProp('backSpots', v); })
        ] },
        { title: 'THE NUMBERS', titleStyle: titleStyle, style: sectionStyle, rows: [
          step('Stability, ±', 'how far apart two stacks in one column may be', RULES.stability == null ? 6 : RULES.stability,
            1, 6, function (v) { setRule('stability', v > 5 ? null : v); },
            function (v) { return v > 5 ? 'off' : '± ' + v; }),
          step('A small order is', 'at or under this many crates it can go up on a stack',
            RULES.thin, 1, 4, function (v) { setRule('thin', v); },
            function (v) { return '≤ ' + v; })
        ] }
      ] },
      { style: 'position:absolute;left:29.125rem;top:6.5rem;width:25.875rem;' + colStyle, sections: [
        { title: 'WHEN A PILE NEEDS SOMEWHERE TO GO', titleStyle: titleStyle, style: sectionStyle,
          rows: pri.map(function (k, i) {
            return rankRow(PRI[k][0], PRI[k][1], i, pri.length, movePri);
          }) },
        { title: 'AND THESE', titleStyle: titleStyle, style: sectionStyle, rows: [
          toggle('A lone crate goes to the side well', 'easy to reach, and off anybody else’s stack',
            RULES.singleCrateWell, function (v) { setRule('singleCrateWell', v); }),
          toggle('Two customers may share a stack', 'off means the board will not offer it at all',
            RULES.allowCombine, function (v) { setRule('allowCombine', v); }),
          toggle('The side well is kept for freeze ware', 'it has to still fit at the end of the load',
            RULES.freezeAtWell, function (v) { setRule('freezeAtWell', v); }),
          toggle('Warn when a stop loads out of turn', 'a warning about the order of the taps',
            RULES.orderGuard, function (v) { setRule('orderGuard', v); }),
          fixedRow('Nothing deeper than a stop delivered before it',
            'the rule the whole load runs backwards to produce')
        ] }
      ] }
    ];

    // The live session, not an illustration of one — so the shape on the right
    // is the shape the next crate actually goes into. No tether: there is no
    // dock on this screen for one to run to.
    var S = this.scene(st, accent, null, { x: 896, y: 156, w: 520, h: 560, tether: false });
    var facts = [
      ['POSITIONS', String(ORDER.length)],
      ['THROUGH THE SIDE', String(SIDE_DOOR_ROWS * 2)],
      ['PACKING SPOTS', nSide + ' + ' + nBack],
      ['STACK', 'up to ' + CAP]
    ].map(function (f) {
      return { label: f[0], value: f[1],
        labelStyle: mono + 'font-size:0.625rem;letter-spacing:.09em;color:#5F5876;',
        valueStyle: 'font:800 1.1875rem/1.15 Archivo,system-ui,sans-serif;letter-spacing:-.02em;color:#F2EEF8;' };
    });
    var same = JSON.stringify(RULES) === JSON.stringify(RULE_DEFAULTS)
      && ROWS === 9 && CAP === 8 && SIDE_DOOR_ROWS === 4 && nSide === 3 && nBack === 2;

    return {
      screen: 'settings',
      title: 'Loading rules',
      sub: 'THE VAN, AND WHAT THE BOARD REACHES FOR FIRST',
      cols: cols,
      preview: { box: S.box, parts: S.parts },
      facts: facts,
      reset: function () {
        ['rows', 'capacity', 'sideDoorRows', 'sideSpots', 'backSpots'].forEach(function (k) { delete self.props[k]; });
        self.props.rules = {};
        resetRules();
        self.setState({ target: null, host: null });
      },
      resetStyle: this.btn(same ? 'off' : 'quiet', 48, accent) + 'width:10.75rem;font-size:0.875rem;',
      resetLabel: same ? 'Defaults' : 'Restore defaults',
      // Whether these survive the tablet being put down is a fact about the
      // browser, not about the settings, so it is passed in rather than probed
      // from here — model.js and board.js run under node in the tests.
      saved: this.props.storage === 'on'
          ? 'Saved on this tablet. The load itself is not — that starts fresh each morning.'
        : this.props.storage === 'off'
          ? 'This browser will not store them: they go back to the defaults on reload.'
        : '',
      savedStyle: "font:400 0.75rem/1.4 'Space Grotesk',sans-serif;color:"
        + (this.props.storage === 'off' ? '#FFB570' : '#5F5876') + ';',
      back: function () { self.setState({ screen: 'board' }); },
      backStyle: this.btn('go', 48, accent) + 'width:11rem;font-size:0.9375rem;',
      backLabel: 'Back to the board'
    };
  }

  renderVals() {
    var self = this;
    // The van is a setting, and there is more than one van. Reshape first, then
    // make the board's state fit the shape it just got. The rules are reset and
    // re-applied every paint so a component carries its own and nothing leaks
    // between two of them sharing the module.
    configure(this.props);
    resetRules();
    configureRules(this.props.rules || {});
    // Reshape the state to whatever the van has just become BEFORE either screen
    // reads it. Growing the van back after shrinking it leaves the state without
    // the positions that just came into existence, and everything that walks
    // ORDER then reads an undefined stack.
    var st = normalize(this.state.st);
    var accentIn = this.props.accent == null ? '#B48EF7' : this.props.accent;
    if (this.state.screen === 'settings') return this.settingsVals(accentIn);
    var tier = this.props.tier == null ? 1 : this.props.tier;
    var plan = tier >= 2 ? planAhead(COUNTS, st) : null;
    var accent = this.props.accent == null ? '#B48EF7' : this.props.accent;
    var S = this.scene(st, accent, plan);

    var free = positionsLeft(st, 'side') + positionsLeft(st, 'back');
    var sideLeft = positionsLeft(st, 'side');
    var doneStops = QUEUE.filter(function (k) { return st.closed[k]; }).length;
    var big = 'font:800 1.375rem/1.15 Archivo,system-ui,sans-serif;letter-spacing:-.02em;color:';
    var stats = [
      { label: 'POSITIONS LEFT', value: positionsHeld(st) ? free + ' · ' + positionsHeld(st) + ' held' : String(free),
        style: big + (free ? '#F2EEF8' : '#F7768E') + ';' },
      { label: 'SIDE DOOR', value: sideLeft ? sideLeft + ' left' : 'shut', style: big + (sideLeft ? '#FFB570' : '#F7768E') + ';' },
      // cratesIn read 0 with five stacks aboard, because a blind push records an
      // unknown and (l.n || 0) scores an unknown as nothing. Positions is the
      // number that is always exact; the crate figure joins it only when every
      // position aboard was counted.
      { label: uncountedIn(st) ? 'POSITIONS IN' : 'CRATES IN',
        value: uncountedIn(st) ? positionsIn(st) + ' · ' + uncountedIn(st) + ' blind' : String(cratesIn(st)),
        style: big + '#CDC6DD;' },
      { label: 'STOPS', value: doneStops + ' / ' + QUEUE.length, style: big + '#CDC6DD;' }
    ];

    // ── the route, in loading order ──────────────────────────────────────────
    var doorBtn = 'width:3.875rem;height:2.875rem;border-radius:0.625rem;display:flex;align-items:center;justify-content:center;'
      + "font:700 0.8125rem/1 'Space Grotesk',sans-serif;flex:none;";
    var queue = QUEUE.map(function (k) {
      var closed = !!st.closed[k], at = spotHolding(st, k), pos = positionsOf(st, k);
      var isFocus = at && at.id === S.focus;
      var state, col;
      var mine = 0, blind = false;
      pos.forEach(function (id) {
        st.van[id].forEach(function (l) {
          if (l.cust !== k) return;
          if (l.n == null) blind = true; else mine += l.n;
        });
      });
      if (closed) {
        state = !pos.length ? 'DONE · nothing aboard'
          : blind ? 'DONE · ' + pos.length + (pos.length === 1 ? ' position' : ' positions') + ' · uncounted'
          : 'DONE · ' + mine + ' in ' + pos.length + (pos.length === 1 ? ' position' : ' positions');
        col = '#4FD6A8';
      }
      else if (isFocus) { state = 'PACKING · ' + at.name; col = '#CBB0FF'; }
      else if (at) { state = 'ON ' + at.name; col = '#FFB570'; }
      else if (pos.length) { state = 'PART IN · ' + pos.map(posLabel).join(' '); col = '#8D87A0'; }
      else { state = 'STOP ' + stopOf(k).i + ' · WAITING'; col = '#5F5876'; }

      function door(d) {
        var bs = beginState(st, k, d);
        var tone = bs.kind === 'ready' ? (d === 'side' ? 'rgba(255,181,112,.10);border:0.0625rem solid rgba(255,181,112,.45);color:#FFB570'
                                                       : 'rgba(203,176,255,.10);border:0.0625rem solid rgba(180,142,247,.5);color:#CBB0FF')
          : bs.kind === 'packing' ? 'rgba(242,238,248,.05);border:0.0625rem solid ' + accent + '80;color:#F2EEF8'
          : bs.kind === 'move' ? 'rgba(203,176,255,.05);border:0.0625rem dashed rgba(180,142,247,.5);color:#CBB0FF'
          : bs.kind === 'well' || bs.kind === 'order' ? 'rgba(255,181,112,.07);border:0.0625rem dashed rgba(255,181,112,.45);color:#C09263'
          : 'rgba(242,238,248,.02);border:0.0625rem solid #201C2B;color:#3F3A52';
        return {
          style: doorBtn + 'background:' + tone + ';',
          label: bs.kind === 'move' ? 'move' : (d === 'side' ? 'side' : 'rear'),
          tap: (bs.kind === 'nospot' || bs.kind === 'shut') ? noop : function () {
            var landed = null;
            self.apply(function (s) { landed = doBegin(s, k, d); });
            self.setState({ focus: landed, target: null, host: null });
          }
        };
      }
      var sideB = door('side'), rearB = door('back');
      return {
        tap: function () { if (at) self.setState({ focus: at.id, target: null, host: null }); },
        tile: 'display:flex;align-items:center;gap:0.5625rem;padding:0.5rem 0.5625rem;border-radius:0.6875rem;cursor:pointer;'
          + 'flex:1 1 0;min-height:3.875rem;max-height:6rem;'
          + 'background:' + (isFocus ? '#191524' : '#0E0C14') + ';border:0.0625rem solid '
          + (isFocus ? accent + '80' : (closed ? 'rgba(79,214,168,.22)' : '#1B1826')) + ';',
        barStyle: 'width:0.5rem;align-self:stretch;border-radius:0.1875rem;flex:none;background:' + CUST[k].color + (closed ? '55' : ''),
        name: CUST[k].name,
        nameStyle: 'font:700 0.9375rem/1.15 Archivo,system-ui,sans-serif;letter-spacing:-.02em;overflow:hidden;'
          + 'text-overflow:ellipsis;white-space:nowrap;color:' + (closed || at ? '#F2EEF8' : '#8D87A0') + ';',
        state: state,
        stateStyle: "font:500 0.6875rem/1.2 'IBM Plex Mono',monospace;letter-spacing:.05em;color:" + col + ';'
          + 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;',
        hasDoors: !closed, hasReopen: closed,
        side: sideB.tap, sideStyle: sideB.style, sideLabel: sideB.label,
        rear: rearB.tap, rearStyle: rearB.style, rearLabel: rearB.label,
        reopen: function () { self.apply(function (s) { doReopen(s, k); }); },
        reopenStyle: 'width:8.0625rem;height:2.875rem;border-radius:0.625rem;display:flex;align-items:center;justify-content:center;'
          + "font:600 0.8125rem/1 'Space Grotesk',sans-serif;flex:none;background:rgba(242,238,248,.03);color:#4A445C;"
      };
    });

    // ── the two ways this goes wrong before anybody notices ──────────────────
    // Both are counts crossing, and both are only fixable while there is still
    // a choice — so they are said the moment they cross, not when they bite.
    var lines = [];
    // Loudest first: this one is not a forecast, it is a statement about crates
    // that are already in the van in an order that will cost an unload.
    depthFaults(st).slice(0, 2).forEach(function (f) {
      lines.push(CUST[f.deepCust].name + ' at ' + posLabel(f.deep) + ' is deeper than '
        + CUST[f.shallowCust].name + ' at ' + posLabel(f.shallow) + ', and comes out first — '
        + CUST[f.shallowCust].name + ' has to come off to reach them.');
    });
    // The side door shutting on stacks that are still standing at it. Naming the
    // shortfall is not the same as naming who it lands on: the stacks go in in
    // loading order, so the ones past the position count are the ones stranded.
    var queued = SPOTS.filter(function (sp) { return sp.door === 'side' && st.staged[sp.id]; })
      .sort(function (a, b) {
        return QUEUE.indexOf(st.staged[a.id].cust) - QUEUE.indexOf(st.staged[b.id].cust);
      });
    var stranded = queued.slice(sideLeft);
    if (stranded.length) {
      lines.push(sideLeft + ' position' + (sideLeft === 1 ? '' : 's') + ' left through the side door and '
        + queued.length + ' stacks standing at it — '
        + listOf(stranded.map(function (sp) { return sp.name + ' (' + CUST[st.staged[sp.id].cust].short + ')'; }))
        + ' will have to be carried round.');
    }
    var notInYet = QUEUE.filter(function (x) { return !st.closed[x] && !isAboard(st, x); }).length;
    if (free < notInYet) {
      lines.push(free + ' position' + (free === 1 ? '' : 's') + ' left and ' + notInYet
        + ' stops with nothing aboard — some will have to share a stack.');
    }
    var warn = {
      show: lines.length > 0,
      text: lines.join('  '),
      style: 'padding:0.5625rem 0.75rem;border-radius:0.6875rem;flex:none;font:400 0.78125rem/1.35 "Space Grotesk",sans-serif;'
        + 'background:rgba(247,118,142,.09);border:0.0625rem solid rgba(247,118,142,.35);color:#F7768E;'
    };

    var toolBig = "font:700 0.9375rem/1 'Space Grotesk',sans-serif;";
    var toolSub = "font:400 0.625rem/1 'IBM Plex Mono',monospace;letter-spacing:.07em;opacity:.7;";
    var tools = [
      { label: '⚙ Rules', sub: 'the van, the priority',
        tap: function () { self.setState({ screen: 'settings' }); },
        style: this.btn('quiet', 58, accent) + 'width:7.25rem;',
        bigStyle: toolBig, subStyle: toolSub },
      { label: '⚑ Odd crate', sub: st.flags ? st.flags + ' flagged' : 'off route',
        tap: function () { self.apply(function (s) { s.flags = (s.flags || 0) + 1; }); },
        style: this.btn(st.flags ? 'warn' : 'quiet', 58, accent) + 'width:8rem;',
        bigStyle: toolBig, subStyle: toolSub },
      { label: '❄ Freeze', sub: st.frozenAtDoor ? 'side well' : 'none today',
        tap: function () { self.apply(function (s) { s.frozenAtDoor = !s.frozenAtDoor; }); },
        style: this.btn(st.frozenAtDoor ? 'quiet' : 'off', 58, accent) + 'width:7.375rem;',
        bigStyle: toolBig, subStyle: toolSub }
    ];

    // Consumed here rather than through setState: a second paint would replay
    // the animation, and every other action would replay it again after that.
    this.state.flash = null;

    // The route's own name and date, or the demo's when nothing set them. A
    // header that says a different day from the one you are loading is worse
    // than a header with no date at all, so this is a prop rather than a
    // constant — the app passes what the plan said.
    return {
      head: { title: this.props.routeName || 'Stavanger Route',
              sub: (this.props.routeDate || 'WED 19 AUG') + ' · ' + STOPS.length + ' STOPS · '
                + (tier === 1 ? 'ROUTE ONLY' : (tier === 2 ? 'COUNTS KNOWN' : 'FULLY SCANNED')),
              // The arrow is drawn either way; it becomes a control only where
              // there is somewhere to go back to. The demo is the whole page
              // and has nowhere, so it stays a picture and does not pretend
              // otherwise — the runtime only sets the pointer cursor and binds
              // a click when this resolves to a function.
              back: typeof this.props.onBack === 'function' ? this.props.onBack : null },
      stats: stats,
      screen: 'board',
      scene: { box: S.box, parts: S.parts, geo: S.geo },
      con: this.consoleVals(st, accent, plan, S),
      queue: queue, warn: warn, tools: tools
    };
  }
}


// ── boot ─────────────────────────────────────────────────────────────────────
function startProps(extra) {
  var p = { tier: 1, accent: '#B48EF7', storage: storageWorks() ? 'on' : 'off' };
  Object.keys(extra || {}).forEach(function (k) { p[k] = extra[k]; });
  return p;
}
COMPONENT = new Component(startProps());

// Restore, then raise anything that would have been smaller than the load the
// session starts with — the same invariant the steppers enforce, applied to the
// reload rather than to a tap.
var stored = readSettings(loadStored());
if (stored) {
  var fitted = fitSettings(stored, COMPONENT.state.st);
  Object.keys(fitted.van).forEach(function (k) { COMPONENT.props[k] = fitted.van[k]; });
  COMPONENT.props.rules = fitted.rules;
}

// Written after every paint rather than from each control: that is one place
// instead of a dozen, and it cannot miss a path — including Restore defaults,
// which writes nothing and so removes the key.
var lastWritten = loadStored();
ON_PAINT = function () {
  var payload = writeSettings(COMPONENT.props);
  var bare = !Object.keys(payload.van).length && !Object.keys(payload.rules).length;
  var text = bare ? null : JSON.stringify(payload);
  if (text === lastWritten) return;
  saveStored(text);
  lastWritten = text;
};

document.querySelectorAll('[data-tier]').forEach(function (b) {
  b.addEventListener('click', function () {
    COMPONENT.props.tier = Number(b.dataset.tier);
    paint();
  });
});
// Start over is about the load, not the rules — the van does not change shape
// because the morning did.
document.getElementById('reset').addEventListener('click', function () {
  var keep = writeSettings(COMPONENT.props);
  COMPONENT = new Component(startProps(Object.assign({ tier: COMPONENT.props.tier, rules: keep.rules }, keep.van)));
  paint();
});

// ── how big the drawing is ───────────────────────────────────────────────────
// One number resizes the page, because the page has one unit. The board's own
// box is a constant; the chrome bar's height is not — it depends on the fonts
// that actually loaded — but it is a constant *in rem*, since the bar is 90rem
// wide whatever the viewport is and so always wraps the same way. So measure it
// at the design size, which costs one forced layout and cannot go circular.
var DESIGN = 16, BOARD_W = 90, BOARD_H = 52.5;
var root = document.documentElement, big = false;
function fit() {
  root.style.fontSize = DESIGN + 'px';
  var pageH = BOARD_H + document.getElementById('chrome').getBoundingClientRect().height / DESIGN;
  var s = Math.min((window.innerWidth - 16) / (BOARD_W * DESIGN),
                   (window.innerHeight - 8) / (pageH * DESIGN));
  // Full screen means the whole screen: this is a drawing, not a bitmap, so
  // past its design size it gets bigger rather than blurrier. Everywhere else
  // the design size is still the ceiling.
  root.style.fontSize = (DESIGN * Math.max(0.2, big ? s : Math.min(1, s))) + 'px';
}
window.addEventListener('resize', fit);

// ── full screen ──────────────────────────────────────────────────────────────
// Two things, deliberately: the page's own big layout, and the browser's
// fullscreen if it will give it. Asking is best-effort — inside an iframe
// without the fullscreen permission the request is simply refused, and there
// the slim bar plus the URL bar we cannot remove is still the whole win. So the
// layout never waits on the API, and the API never becomes the state.
var fullBtn = document.getElementById('full');
function fullEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function setBig(v) {
  big = v;
  document.body.classList.toggle('big', v);
  fullBtn.textContent = v ? 'Exit full screen' : 'Full screen';
  fit();
}
function askFull() {
  var req = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!req) return;
  try { var r = req.call(root); if (r && r.catch) r.catch(function () {}); } catch (e) {}
}
function dropFull() {
  var ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (!fullEl() || !ex) return;
  try { var r = ex.call(document); if (r && r.catch) r.catch(function () {}); } catch (e) {}
}
fullBtn.addEventListener('click', function () {
  if (big) { setBig(false); dropFull(); } else { setBig(true); askFull(); }
});
// Escape leaves the browser's fullscreen without telling the button, so follow
// it out. A refused request fires nothing, which is why big survives one.
['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
  document.addEventListener(ev, function () { if (!fullEl() && big) setBig(false); else fit(); });
});
document.addEventListener('keydown', function (e) {
  if ((e.key !== 'f' && e.key !== 'F') || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  e.preventDefault();
  fullBtn.click();
});

fit();
paint();
</script>
</body>
