# Security headers for every site (hardening review 2026-10-25).
# add_header is not inherited by a location that sets its own add_header, so
# include this both at server level and inside any such location.
# HSTS without includeSubDomains/preload: the apex dblo.net has no HTTPS.
# No CSP yet: gmtool loads map assets and the portfolio uses inline scripts.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
