limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=drinks_login:10m rate=30r/m;

server {
    server_name portfolio.dblo.net;

    client_max_body_size 35m;

    # Gzip compression — shrinks HTML/CSS/JS by ~75% before sending over the wire.
    # Without this, every page response is sent uncompressed.
    #
    # These live in `server`, not at `http` level, deliberately. Ubuntu's stock
    # /etc/nginx/nginx.conf already sets `gzip on;` in the http block, and this
    # file is included *into* that block — a second `gzip on;` there is not a
    # harmless override but a hard `[emerg] "gzip" directive is duplicate`, which
    # fails `nginx -t` and would take the site down on the next reload. In
    # `server` context it is a legal narrowing, so this works whether or not the
    # distro enables gzip globally.
    gzip on;
    gzip_vary on;           # Tells caches the response varies by Accept-Encoding
    gzip_min_length 1024;   # Don't bother compressing tiny responses (not worth the CPU)
    # text/html is deliberately absent: nginx always gzips it and warns
    # ("duplicate MIME type") if you list it.
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # No ssl_session_cache / ssl_session_timeout here on purpose: certbot's
    # options-ssl-nginx.conf, included at the bottom of this same server block,
    # already sets both (shared:le_nginx_SSL:10m, 1440m — the same 24 hours we
    # wanted — plus ssl_session_tickets off). Setting them here too is a
    # duplicate in the same context, not an override.
    #
    # No ssl_stapling either. It was here to save browsers a round trip to the
    # CA, but the live reload proved it never worked: nginx warns
    # `"ssl_stapling" ignored, no OCSP responder URL in the certificate` because
    # Let's Encrypt no longer puts one in its certificates. Keeping it would mean
    # a warning on every reload in exchange for nothing.

    location /api/auth/register/ {
        deny all;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static files: cache aggressively for 1 year.
    # Templates append ?v=<content hash> (src/assets.rs) to every CSS/JS link,
    # so a deploy that changes a file also changes its URL and busts this cache.
    # Files referenced from *inside* style.css (fonts, icons) carry no version —
    # updating one of those means renaming it. The gain for return visitors is
    # that CSS/JS/images load from disk (effectively instant) rather than
    # hitting the network at all.
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Drinking game SSE — nginx must not buffer the stream or it never arrives.
    location ~ ^/drinks/room/[A-Z]+/sse$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # request_origin() (drinkinggame/src/routes.rs) reads this to build
        # the absolute https:// URL encoded into the room QR code.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Drinking game login — a 4-digit PIN is 10k combos; own zone (not the
    # shared /api/auth/ one) still throttles PIN brute force (~30 guesses/min
    # against 10,000 PINs with argon2 per attempt) while surviving a burst of
    # party arrivals behind one NAT IP.
    location = /drinks/login {
        limit_req zone=drinks_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also serves the rest of /drinks (landing, room pages, the screen page
    # that renders the QR code, assets) — request_origin() needs the header
    # here too, not just on the two locations above.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Both families, or the site is dark for most visitors: portfolio.dblo.net
    # has an AAAA record (2a01:4f9:c013:e3c2::1) as well as an A record, and
    # clients prefer IPv6. Dropping the [::] line does not degrade anything —
    # it refuses the connection outright for anyone who resolves to AAAA.
    listen 443 ssl http2; # managed by Certbot
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/portfolio.dblo.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portfolio.dblo.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.dblo.net;

    # Allow Certbot HTTP-01 renewal challenges through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
