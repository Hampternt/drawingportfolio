limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=drinks_login:10m rate=30r/m;

# Gzip compression — shrinks HTML/CSS/JS by ~75% before sending over the wire.
# Without this, every page response is sent uncompressed.
gzip on;
gzip_vary on;           # Tells caches the response varies by Accept-Encoding
gzip_min_length 1024;   # Don't bother compressing tiny responses (not worth the CPU)
gzip_types
    text/html
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

server {
    server_name portfolio.dblo.net;

    client_max_body_size 35m;

    # SSL session cache — lets returning visitors skip the full TLS handshake.
    # Without this, every new connection renegotiates from scratch (~100ms extra).
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # OCSP stapling — server fetches and caches the certificate validity proof,
    # so browsers don't have to make a separate request to the CA on each visit.
    ssl_stapling on;
    ssl_stapling_verify on;

    location /api/auth/register/ {
        deny all;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static files: cache aggressively for 1 year.
    # The filename never changes (no cache-busting hash), so if you update a file
    # you'll need to either rename it or do a hard refresh. This is fine for a
    # hobby site — the gain for return visitors is that CSS/JS/images load from
    # disk (effectively instant) rather than hitting the network at all.
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Drinking game SSE — nginx must not buffer the stream or it never arrives.
    location ~ ^/drinks/room/[A-Z]+/sse$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # request_origin() (drinkinggame/src/routes.rs) reads this to build
        # the absolute https:// URL encoded into the room QR code.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Drinking game login — a 4-digit PIN is 10k combos; own zone (not the
    # shared /api/auth/ one) still throttles PIN brute force (~30 guesses/min
    # against 10,000 PINs with argon2 per attempt) while surviving a burst of
    # party arrivals behind one NAT IP.
    location = /drinks/login {
        limit_req zone=drinks_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also serves the rest of /drinks (landing, room pages, the screen page
    # that renders the QR code, assets) — request_origin() needs the header
    # here too, not just on the two locations above.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Both families, or the site is dark for most visitors: portfolio.dblo.net
    # has an AAAA record (2a01:4f9:c013:e3c2::1) as well as an A record, and
    # clients prefer IPv6. Dropping the [::] line does not degrade anything —
    # it refuses the connection outright for anyone who resolves to AAAA.
    listen 443 ssl http2; # managed by Certbot
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/portfolio.dblo.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portfolio.dblo.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.dblo.net;

    # Allow Certbot HTTP-01 renewal challenges through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
