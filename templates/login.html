<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Portfolio</title>
  <link rel="stylesheet" href="/static/style.css?v={{ crate::assets::asset_version() }}">
  <style>
    /* Standalone page — it does not extend base.html, so its styles live here.
       Like admin.html in that, but with no header and no palette, so the one
       way out is the back link. Links here must not be boosted: a boosted swap
       drops this <head>, and these rules with it. */
    .login-box { max-width: 360px; margin: 4rem auto; padding: 2rem; background: #fff; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
    .login-box button { padding: 0.75rem 2rem; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    #status { margin-top: 1rem; color: #c00; min-height: 1.2em; }
    .login-sep { display: flex; align-items: center; gap: .75rem; margin: 1.5rem 0 1rem; color: #999; font-size: .85rem; }
    .login-sep::before, .login-sep::after { content: ""; flex: 1; height: 1px; background: #ddd; }
    .pin-form { display: flex; flex-direction: column; gap: .6rem; }
    .pin-form input { padding: .65rem .75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .pin-form button { background: #555; width: 100%; }
    .login-hint { margin-top: 1rem; font-size: .8rem; color: #888; }
    .login-back { margin-top: 1.25rem; font-size: .85rem; }
    .login-back a { color: #555; }
  </style>
</head>
<body>
  <main hx-boost="false">
    <div class="login-box">
      <h1>Portfolio</h1>

      <p>Log in with your passkey</p>
      <button id="login-btn" onclick="startLogin()">Log in with passkey</button>

      <div class="login-sep">or</div>

      <!-- Name + PIN, for fitness accounts on a device with no passkey. -->
      <form class="pin-form" id="pin-form" onsubmit="return startPinLogin(event)">
        <input type="text" id="pin-name" name="name" placeholder="Name"
               autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <input type="password" id="pin-pin" name="pin" placeholder="PIN"
               inputmode="numeric" autocomplete="current-password"
               minlength="4" maxlength="12" required>
        <button type="submit" id="pin-btn">Log in with PIN</button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>
      <p class="login-hint">PIN accounts are created by the site owner.</p>
      <p class="login-back"><a href="/">← Back to the hub</a></p>
    </div>
  </main>
  <script src="/static/webauthn.js?v={{ crate::assets::asset_version() }}"></script>
</body>
</html>
