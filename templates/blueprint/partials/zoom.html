<div class="bp-zoom" role="group" aria-label="Zoom">
  <button type="button" class="bp-zoom__btn" data-bp-action="zoom-out" aria-label="Zoom out (−)">−</button>
  <button type="button" class="bp-zoom__btn bp-zoom__fit" data-bp-action="fit" aria-label="Fit the plan (F)">fit</button>
  <button type="button" class="bp-zoom__btn" data-bp-action="zoom-in" aria-label="Zoom in (+)">+</button>
</div>
