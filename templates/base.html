<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portfolio{% endblock %}</title>
  <!-- Pre-warm TLS connection to image CDN so first image loads faster -->
  <link rel="preconnect" href="https://portfolio-images.hel1.your-objectstorage.com" crossorigin>
  <link rel="dns-prefetch" href="https://portfolio-images.hel1.your-objectstorage.com">
  <link rel="stylesheet" href="/static/style.css?v={{ crate::assets::asset_version() }}">
  <link rel="prefetch" href="/artportfolio">
  <link rel="prefetch" href="/fitness">
  <link rel="prefetch" href="/tasks">
  <link rel="prefetch" href="/sorting">
  <!-- Self-hosted HTMX — eliminates DNS lookup + TLS handshake to unpkg.com -->
  <script src="/static/htmx.min.js?v={{ crate::assets::asset_version() }}" defer></script>
  <script>const IS_ADMIN = {% if is_admin %}true{% else %}false{% endif %};</script>
  <script src="/static/palette.js?v={{ crate::assets::asset_version() }}" defer></script>
  <script src="/static/artfeed.js?v={{ crate::assets::asset_version() }}" defer></script>
  <script>
    // hx-boost swaps body children, not body attributes — so the body_class
    // block is lost on every boosted navigation. Re-derive each theme class
    // from a marker element in the incoming content instead of trusting it.
    //
    // The markers are the section wrappers: .fitness-page for the nutrition
    // tracker, .art-feed for the drawing portfolio, .sorting-page for the
    // sorting board. Each section's template must keep its marker as the
    // outermost element inside its content block.
    (function () {
      function syncBodyTheme() {
        document.body.classList.toggle('fitness-dark',
          !!document.querySelector('main .fitness-page'));
        document.body.classList.toggle('art-page',
          !!document.querySelector('main .art-feed'));
        document.body.classList.toggle('sorting-dark',
          !!document.querySelector('main .sorting-page'));
      }
      // The target guard matters: without it every fragment swap — Load more,
      // an HTMX partial — re-runs this against a half-updated DOM.
      document.addEventListener('htmx:afterSwap', function (e) {
        if (e.target === document.body) syncBodyTheme();
      });
      document.addEventListener('htmx:historyRestore', syncBodyTheme);
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body hx-boost="true" class="{% block body_class %}{% endblock %}">
  <header>
    <a href="/" class="site-title">Portfolio</a>
    <nav>
      <a href="/artportfolio">Drawing Portfolio</a>
      <a href="/tasks">Drawing Tasks</a>
      <a href="/fitness">Fitness</a>
      <a href="/sorting">Sorting</a>
    </nav>
    <button class="palette-hint" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true}))" aria-label="Open command palette">
      <kbd>Ctrl</kbd><kbd>K</kbd>
    </button>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
